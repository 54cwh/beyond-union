[project]
name = "beyond-union"
version = "0.1.0"
description = "北域绿联：纯前端 + JSON + 双模式打包"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.4,<6",
    "bottle>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1,<3.2",
    "pyinstaller>=6.11,<6.12",
    "playwright>=1.49,<1.50",
    "pytest>=8.3,<8.4",
    "pytest-playwright>=0.5,<0.6",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 全局不忽略规则；预期的盲捕获用局部 `# noqa: BLE001` 标注
ignore = []

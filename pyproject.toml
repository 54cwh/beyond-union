[project]
name = "tiaozhanbei-demo"
version = "0.1.0"
description = "挑战杯 Demo：纯前端 + JSON + 双模式打包"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.4,<6",
    "bottle>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1,<3.2",
    "pyinstaller>=6.11,<6.12",
    "playwright>=1.49,<1.50",
    "pytest>=8.3,<8.4",
    "pytest-playwright>=0.5,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

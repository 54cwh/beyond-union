<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北域绿联 · 页面标题</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/echarts.min.js"></script>
</head>
<body class="min-h-screen bg-background">
  <nav id="site-nav" class="sticky top-0 z-40 px-4 py-3 border-b border-border" style="background:var(--color-background)"></nav>
  <div id="app" class="container mx-auto p-4"></div>

  <script type="module">
    // 本模板列出全部可用 import 作参考；复制后按需保留用到的，删掉不用的
    import { Nav, Data, fetchData } from '../assets/js/common.js';
    import { filterRows, groupBy, toChartData } from '../assets/js/filter.js';
    import { formatNumber, formatMoney, formatPercent, formatDate } from '../assets/js/format.js';
    import { createChart } from '../assets/js/chart-view.js';

    Nav();

    const app = Vue.createApp({
      data() {
        return {
          title: "页面标题",
          loading: false,
          error: "",
        };
      },
      template: `
        <main>
          <h1 class="text-2xl mb-4">{{ title }}</h1>
          <p v-if="loading" class="text-gray-400">加载中…</p>
          <p v-else-if="error" class="text-red-400">{{ error }}</p>
          <div v-else>
            <!-- 页面内容写在这里 -->
            <!-- 数据加载：const data = await Data.load('demo/xxx')（A 的模拟数据） -->
            <!-- 图表容器：需要图表的页面保留此 div，不需要可删。
                 注意：此容器必须在页面首次渲染时就存在（勿置于 v-if 条件分支内），
                 mounted 里 createChart($refs.chart) 依赖它已渲染；加载态用 loading/error 变量控制。 -->
            <div ref="chart" class="w-full h-80"></div>
          </div>
        </main>
      `,
      mounted() {
        // 图表：用统一组件，数据形如 [{label, value}]
        // 聚合结果用 toChartData() 适配后再喂图表
        this.chart = createChart(this.$refs.chart);
        this.chart.setData([{ label: '示例', value: 10 }]);
      },
      beforeUnmount() {
        // 统一组件负责 dispose，页面只需调用
        if (this.chart) { this.chart.dispose(); this.chart = null; }
      },
      computed: {},
    });

    app.mount('#app');
  </script>
</body>
</html>

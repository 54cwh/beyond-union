<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北域绿联 · 绿电入市</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/echarts.min.js"></script>
  <style>
    /* ===== p4 页面级样式（v3 设计语言：粗黑边框仪表盘） ===== */
    .p4-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .p4-col-3 { grid-column: span 3; }
    .p4-col-4 { grid-column: span 4; }
    .p4-col-5 { grid-column: span 5; }
    .p4-col-6 { grid-column: span 6; }
    .p4-col-7 { grid-column: span 7; }
    .p4-col-8 { grid-column: span 8; }
    .p4-col-12 { grid-column: span 12; }
    @media (max-width: 1024px) {
      .p4-col-3, .p4-col-4, .p4-col-5, .p4-col-6, .p4-col-7, .p4-col-8 { grid-column: span 12; }
    }

    .p4-panel {
      background-color: var(--color-panel);
      border: 3px solid var(--color-border);
      border-radius: 20px;
      padding: 14px 16px;
    }

    .p4-stat-card {
      position: relative;
      overflow: hidden;
      background-color: var(--color-panel);
      border: 3px solid var(--color-border);
      border-radius: 20px;
      padding: 14px 16px;
    }
    .p4-stat-card::after {
      content: "";
      position: absolute;
      right: -16px;
      top: -16px;
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.10), transparent 70%);
      pointer-events: none;
    }
    .p4-stat-value {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 26px;
      line-height: 1.2;
      color: var(--color-accent-dark);
    }
    .p4-stat-label { font-size: 12px; opacity: 0.55; margin-top: 2px; }

    .p4-chip {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      border: 2px solid var(--color-border);
      background-color: var(--color-panel);
      color: var(--color-foreground);
      cursor: pointer;
      transition: all 160ms ease;
    }
    .p4-chip:hover { border-color: var(--color-accent); color: var(--color-accent-dark); }
    .p4-chip.active {
      background: var(--color-accent);
      border-color: var(--color-accent-dark);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* 预设问题区：与上方对话消息区保持间距 */
    .p4-presets { margin-top: 8px; }

    .p4-bar-track { background-color: var(--color-accent-light); border-radius: 999px; height: 8px; overflow: hidden; }
    .p4-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.5), var(--color-accent));
      transition: width 400ms ease;
    }

    /* ===== 情景实验室：页内对话卡片 ===== */
    .p4-lab-body {
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      background: var(--color-panel);
      border: 2px solid var(--color-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .p4-msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    .p4-msg--user {
      align-self: flex-end;
      background: var(--color-accent);
      border: 2px solid var(--color-accent-dark);
      color: #FFFFFF;
      font-weight: 600;
    }
    .p4-msg--ai {
      align-self: flex-start;
      background: var(--color-panel);
      border: 2px solid var(--color-border);
      color: var(--color-foreground);
    }
    .p4-lab-result {
      margin-top: 8px;
      border-top: 1px dashed var(--color-border-soft);
      padding-top: 8px;
    }
    .p4-lab-result__row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 3px;
    }
    .p4-lab-result__row .k { opacity: 0.55; }
    .p4-lab-result__row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .p4-lab-conf {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      color: var(--color-accent-dark);
      background: var(--color-accent-light);
      border: 1px solid var(--color-accent);
      border-radius: 9999px;
      padding: 2px 10px;
    }
    #p4-lab-input {
      flex: 1;
      border: 2px solid var(--color-border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--color-foreground);
      outline: none;
      background: var(--color-panel);
      font-family: var(--font-body);
    }
    #p4-lab-input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12); }
    #p4-lab-send {
      border: 2px solid var(--color-accent-dark);
      border-radius: 12px;
      padding: 0 18px;
      background: var(--color-accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 160ms ease;
    }
    #p4-lab-send:hover { opacity: 0.88; }

    /* 报价条 */
    .quote-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .quote-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      background: var(--color-accent-light);
      border: 2px solid var(--color-border);
    }
    .quote-item__name { font-size: 12px; opacity: 0.6; }
    .quote-item__value { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* 锚点价格：纵向铺满，避免与同排快讯/规则高度差导致的底部空档 */
    .p4-anchors { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .p4-anchors > div { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .p4-scroll { position: relative; }
    .p4-scroll::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 24px;
      background: linear-gradient(transparent, var(--color-panel));
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen bg-background">
  <nav id="site-nav" class="sticky top-0 z-40"></nav>
  <div id="app" class="container mx-auto p-4"></div>

  <script type="module">
    // 绿电入市决策中心（C 前端）
    // 数据源：A 的 data/demo（market/generation/storage/tasks），当前 A 数据未合并 → 先内联示例数字，合并后切 Data()
    import { Nav, Data } from '../assets/js/common.js';
    import { formatNumber, formatPercent } from '../assets/js/format.js';
    import { createChart } from '../assets/js/chart-view.js';

    Nav();

    const app = Vue.createApp({
      data() {
        return {
          title: "绿电入市",
          tab: "market",
          loading: false,
          error: "",
          updated: "2026-08-19 15:40",
          marketLoaded: false,
          marketData: null,
          genData: null,
          // 市场快讯（模拟新闻，对应市场动态）
          news: [
            { id: "N1", title: "吉林电力现货市场转入正式运行，常态化开展日前结算", tag: "现货", time: "08-19 09:30", level: 1 },
            { id: "N2", title: "东北区域辅助服务市场规则修订，储能参与调频补偿上调", tag: "辅助服务", time: "08-19 08:10", level: 2 },
            { id: "N3", title: "8 月下旬东北多风，风电出力预计提升，现货价格或承压", tag: "气象", time: "08-18 17:40", level: 1 },
            { id: "N4", title: "绿电交易规模持续扩大，东北绿电环境溢价区间 30-60 元", tag: "绿电", time: "08-18 10:00", level: 3 },
            { id: "N5", title: "辽宁发布现货市场结算细则修订稿，差价结算方式明确", tag: "规则", time: "08-17 15:20", level: 2 },
          ],
          // 2. 企业资源池
          pool: { forecast: 142.3, locked: 65, storage: 18.2, flexible: 59 },
          // 3. 方案生成器
          preference: "balanced",
          midtermPct: 65,
          storageArbitrage: true,
          generated: false,
          recommendation: null,
          // 7. 市场规则影响
          rules: [
            { id: "R1", name: "吉林中长期持仓约束", detail: "中长期合同量占比不低于 60%，超限部分按现货结算" },
            { id: "R2", name: "偏差考核条款", detail: "偏差率 3% 以内免考核；超发按最低价 90% / 少发按最高价 110% 结算" },
            { id: "R3", name: "现货限价", detail: "辽宁现货限价 -100 ~ 1500 元/MWh，东北省间互济 1500~1700 元/MWh" },
          ],
          // 8. 情景实验室
          scenarios: [
            { key: "s1", name: "寒潮来袭", desc: "风速变化、温度下降，风电预测波动加大" },
            { key: "s2", name: "风速骤降30%", desc: "未来 24h 风功率预测显著下调" },
            { key: "s3", name: "光伏出力降25%", desc: "多云天气，辐照大幅下降" },
            { key: "s4", name: "现货价格上涨30%", desc: "市场供需紧张，晚高峰电价走高" },
            { key: "s5", name: "储能可用容量降20%", desc: "储能维护，可调容量受限" },
            { key: "s6", name: "并网限制增加", desc: "电网约束，外送受限" },
            { key: "s7", name: "预测偏差扩大", desc: "气象模型分歧加大，置信区间收窄" },
            { key: "s8", name: "自定义", desc: "自定义参数推演" },
          ],
          // 情景实验室：页内对话卡片
          labMessages: [],
        };
      },
      computed: {
        spotPct() {
          return 100 - this.midtermPct;
        },
        flexiblePct() {
          return Math.round((this.pool.flexible / this.pool.forecast) * 100);
        },
        midtermAvg() {
          if (this.marketData && this.marketData.midterm_monthly && this.marketData.midterm_monthly.length) {
            const ms = this.marketData.midterm_monthly;
            return Math.round(ms.reduce((s, m) => s + (m.monthly || 0), 0) / ms.length);
          }
          return 332;
        },
        greenPremium() {
          if (this.marketData && this.marketData.green && this.marketData.green.premium) {
            return this.marketData.green.premium.value;
          }
          return 45;
        },
        greenCert() {
          if (this.marketData && this.marketData.green && this.marketData.green.cert_price) {
            return this.marketData.green.cert_price.value;
          }
          return 5.15;
        },
        anchors() {
          if (this.marketData && this.marketData.anchors) {
            return this.marketData.anchors.slice(0, 4);
          }
          return [];
        },
        marketRules() {
          if (this.marketData && this.marketData.rules) {
            return this.marketData.rules.slice(0, 5);
          }
          return [];
        },
        quoteItems() {
          const day = (this.marketData && this.marketData.day_ahead) || [];
          const rt = (this.marketData && this.marketData.real_time) || [];
          const ms = (this.marketData && this.marketData.midterm_monthly) || [];
          const dayAvg = day.length ? Math.round(day.reduce((s, d) => s + d.price, 0) / day.length) : 350;
          const rtAvg = rt.length ? Math.round(rt.reduce((s, d) => s + d.price, 0) / rt.length) : 214;
          const midAvg = ms.length ? Math.round(ms.reduce((s, m) => s + m.monthly, 0) / ms.length) : 332;
          return [
            { name: "中长期", value: midAvg, unit: "元/MWh", trend: "up" },
            { name: "日前", value: dayAvg, unit: "元/MWh", trend: "up" },
            { name: "实时", value: rtAvg, unit: "元/MWh", trend: "down" },
            { name: "绿电溢价", value: this.greenPremium, unit: "元/MWh", trend: "" },
            { name: "绿证", value: this.greenCert, unit: "元/个", trend: "" },
          ];
        },
      },
      methods: {
        fmtNum: formatNumber,
        fmtPct: formatPercent,
        // 方案生成器：按风险偏好 + 现货比例生成推荐方案（含基准对比）
        genStrategy() {
          const spot = this.spotPct;
          const base = 18.4 + (spot - 35) * 0.008;      // 现货比例越高，收益略升
          const baseRisk = 35 + (spot - 35) * 0.4;      // 风险同向
          const prefMap = {
            conservative: { name: "稳健策略", mid: 80, spot: 20, desc: "高比例中长期锁定，波动最小", gain: 0.4 },
            balanced: { name: "均衡策略", mid: 65, spot: 35, desc: "收益与风险平衡，适应市场波动", gain: 1.2 },
            aggressive: { name: "进取策略", mid: 50, spot: 50, desc: "扩大现货敞口，博取更高收益", gain: 1.9 },
          };
          const pref = prefMap[this.preference] || prefMap.balanced;
          const arbi = this.storageArbitrage ? 0.5 : 0;
          this.recommendation = {
            name: pref.name,
            desc: pref.desc,
            revenue: base + pref.gain + arbi,
            risk: baseRisk + (this.preference === "conservative" ? -15 : this.preference === "aggressive" ? 20 : 0),
            baselineRevenue: base - 0.4,
            spot,
            reasons: [
              `现货比例 ${spot}%，中长期 ${this.midtermPct}%，锁定基础电量`,
              this.storageArbitrage ? "开启储能套利：午间充电、晚峰放电" : "未开启储能套利",
              this.preference === "conservative" ? "低风险偏好，优先保收益稳定" : (this.preference === "aggressive" ? "进取偏好，承受更高波动换收益" : "均衡偏好，收益风险兼顾"),
            ],
          };
          this.generated = true;
        },
        // 生成一条推演消息（场景 key + 用户问题）
        simulateScene(sceneKey, question) {
          const s = this.scenarios.find((x) => x.key === sceneKey) || this.scenarios[1];
          const drop = { s1: 0.18, s2: 0.3, s3: 0.12, s4: 0.05, s5: 0.08, s6: 0.15, s7: 0.1, s8: 0.1 }[sceneKey] || 0.1;
          const origGen = 142;
          const optGen = Math.round(origGen * (1 - drop) * 10) / 10;
          return {
            type: "scene",
            q: question || `推演场景：${s.name}`,
            conclusion: `${s.name}下，发电 ${origGen} → ${optGen} MWh，建议现货敞口降至 27%`,
            impact: "预计偏差成本下降约 3200 元，收益波动收窄",
            confidence: 87,
            model: "ScenarioLab v1.1",
            original: { gen: origGen, spot: 40, storage: 18, revenue: 19.1 },
            optimized: { gen: optGen, spot: 27, storage: "重新调度", revenue: 21.4 },
          };
        },
        // 点预设场景
        runScene(key) {
          const msg = this.simulateScene(key, null);
          this.labMessages.push(msg);
          this.scrollLab();
        },
        // 自由提问 → 关键词匹配（方案生成 / 情景推演 / 规则）
        sendLab() {
          const input = this.$refs.labInput;
          const q = (input.value || "").trim();
          if (!q) return;
          // 方案生成类问题
          if (/方案|策略|生成|怎么卖|如何交易|建议/.test(q)) {
            this.genPlanMsg(q);
            input.value = "";
            this.scrollLab();
            return;
          }
          // 规则类问题
          if (/规则|政策|约束|考核/.test(q)) {
            this.labMessages.push({
              type: "rule",
              q,
              conclusion: "当前适用的市场交易规则如下：",
            });
            input.value = "";
            this.scrollLab();
            return;
          }
          // 情景推演类
          let key = "s8";
          if (/风速|风功率|骤降|下降.*风/.test(q)) key = "s2";
          else if (/光伏|辐照|多云/.test(q)) key = "s3";
          else if (/现货|价格|上涨|市场/.test(q)) key = "s4";
          else if (/储能|容量|电池/.test(q)) key = "s5";
          else if (/并网|限制|外送/.test(q)) key = "s6";
          else if (/预测.*偏差|偏差.*扩大/.test(q)) key = "s7";
          else if (/寒潮|低温|温度/.test(q)) key = "s1";
          const msg = this.simulateScene(key, q);
          this.labMessages.push(msg);
          input.value = "";
          this.scrollLab();
        },
        // 对话式生成推荐方案消息
        genPlanMsg(q) {
          this.genStrategy();
          const rec = this.recommendation;
          this.labMessages.push({
            type: "plan",
            q,
            ...rec,
          });
        },
        // 预设问题快捷发送
        sendPreset(q) {
          const input = this.$refs.labInput;
          if (input) input.value = q;
          this.sendLab();
        },
        scrollLab() {
          this.$nextTick(() => {
            const el = this.$refs.labBody;
            if (el) el.scrollTop = el.scrollHeight;
          });
        },
        fmtRev(v) {
          return "¥" + Number(v).toFixed(1) + "万";
        },
        // 市场雷达折线图：日前 vs 实时分时价格（走 chart-view line）
        async loadMarketData() {
          try {
            const market = await Data("demo/market");
            this.marketData = market;
            this.marketLoaded = true;
            let gen = null;
            try { gen = await Data("demo/generation"); } catch (e) {}
            this.genData = gen;
            this.$nextTick(() => {
              this.renderMarketChart();
              this.renderGenPriceChart();
            });
          } catch (e) {
            // market.json 缺失时保持内联卡（不阻断页面）
          }
        },
        renderMarketChart() {
          if (!this.$refs.marketChart) return;
          if (!this.marketChart) this.marketChart = createChart(this.$refs.marketChart);
          const day = (this.marketData && this.marketData.day_ahead) || [];
          const rt = (this.marketData && this.marketData.real_time) || [];
          if (day.length === 0) return;
          const labels = day.slice(0, 24).map((d) => {
            const t = d.time.split(" ")[1] || "";
            return t.slice(0, 5);
          });
          const dayData = day.slice(0, 24).map((d) => d.price);
          const rtData = rt.slice(0, 24).map((d) => d.price);
          this.marketChart.setData({
            labels,
            series: [
              { name: "日前", data: dayData },
              { name: "实时", data: rtData },
            ],
          }, { type: "line", smooth: true });
        },

        // 发电 vs 日前电价关联图（24h，双轴）
        renderGenPriceChart() {
          if (!this.$refs.genPriceChart) return;
          if (!this.genPriceChart) this.genPriceChart = createChart(this.$refs.genPriceChart);
          const fc = (this.genData && this.genData.forecast) || [];
          if (fc.length === 0) return;
          const day = fc.slice(0, 24);
          const labels = day.map((d) => { const t = d.time.split(" ")[1] || ""; return t.slice(0, 5); });
          this.genPriceChart.setData({
            labels,
            series: [
              { name: "发电出力(MW)", data: day.map((d) => Math.round(d.gen_total * 10) / 10) },
              { name: "日前电价(元/MWh)", data: day.map((d) => d.price_day_ahead) },
            ],
          }, {
            type: "line", smooth: true,
            yName: "MW", yAxis2: { name: "元/MWh", series: ["日前电价(元/MWh)"] },
          });
        },

      },
      mounted() {
        // 首屏自动生成一组默认策略，让页面开箱即有数据
        this.genStrategy();
        this.loadMarketData();
      },
      beforeUnmount() {
        if (this.marketChart) { this.marketChart.dispose(); this.marketChart = null; }
        if (this.genPriceChart) { this.genPriceChart.dispose(); this.genPriceChart = null; }
      },
      template: `
        <main class="page-wrap">
          <header class="p1-header page-head">
            <div>
              <h1 class="p1-title page-title">{{ title }}</h1>
              <p class="p1-subtitle page-meta">市场行情 · AI 交易决策 · 情景推演</p>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
              <span class="badge badge--accent hidden md:inline-flex">数据更新 {{ updated }}</span>
              <div class="flex gap-1 bg-muted rounded-lg p-1" style="border:2px solid var(--color-border)">
                <button type="button" @click="tab='market'"
                  class="px-4 py-1.5 rounded-md text-sm transition-colors"
                  :class="tab==='market' ? 'btn btn--sm btn--accent' : 'text-foreground opacity-60 hover:opacity-100'">
                  市场行情
                </button>
                <button type="button" @click="tab='decision'"
                  class="px-4 py-1.5 rounded-md text-sm transition-colors"
                  :class="tab==='decision' ? 'btn btn--sm btn--accent' : 'text-foreground opacity-60 hover:opacity-100'">
                  AI 交易决策
                </button>
              </div>
            </div>
          </header>

          <!-- ===== Tab1 市场行情 ===== -->
          <div v-show="tab==='market'">
            <!-- 报价条：5 市场价格紧凑横向，涨跌色 -->
            <div class="quote-bar mb-4" style="border:3px solid var(--color-border);border-radius:10px;background:var(--color-panel);padding:10px 14px">
              <div class="quote-item" v-for="m in quoteItems" :key="m.name">
                <span class="quote-item__name">{{ m.name }}</span>
                <span class="quote-item__value" :class="m.trend === 'up' ? 'trend-up' : (m.trend === 'down' ? 'trend-down' : '')">
                  {{ m.value }}<span style="font-size:10px;opacity:.5;margin-left:2px">{{ m.unit }}</span>
                </span>
                <span v-if="m.trend" style="font-size:11px;font-weight:700" :class="m.trend === 'up' ? 'trend-up' : 'trend-down'">
                  {{ m.trend === 'up' ? '▲' : '▼' }}
                </span>
              </div>
            </div>

            <!-- 两大主图并排：分时行情 + 发电vs电价关联 -->
            <div class="p4-grid mb-4">
              <div class="p4-col-7 p4-panel">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="panel__title" style="margin:0">日前 vs 实时价格</h3>
                  <span class="panel__hint">24h · 元/MWh</span>
                </div>
                <div ref="marketChart" class="w-full h-48"></div>
              </div>
              <div class="p4-col-5 p4-panel">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="panel__title" style="margin:0">发电 vs 电价</h3>
                  <span class="panel__hint">新能源反调峰特征</span>
                </div>
                <div ref="genPriceChart" class="w-full h-48"></div>
              </div>
            </div>

            <!-- 信息区：快讯 + 规则 + 锚点 -->
            <div class="p4-grid">
              <div class="p4-col-5 p4-panel">
                <div class="flex justify-between items-center mb-3">
                  <h3 class="panel__title" style="margin:0">市场快讯</h3>
                  <span class="panel__hint">{{ news.length }} 条 · 滚动查看</span>
                </div>
                <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1 p4-scroll">
                  <div v-for="n in news" :key="n.id" class="flex items-start gap-3 p-2.5 rounded-lg hover:bg-[#F0FDF4] transition-colors cursor-pointer">
                    <span class="badge badge--accent shrink-0">{{ n.tag }}</span>
                    <div class="min-w-0 flex-1">
                      <div class="text-sm leading-snug">{{ n.title }}</div>
                      <div class="text-xs opacity-45 mt-0.5">{{ n.time }}</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="p4-col-4 p4-panel">
                <div class="flex justify-between items-center mb-3">
                  <h3 class="panel__title" style="margin:0">交易规则速览</h3>
                  <span class="panel__hint">各省偏差/结算 · 滚动查看</span>
                </div>
                <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1 p4-scroll">
                  <div v-for="r in marketRules" :key="r.region + r.category" class="p-2.5 rounded-lg bg-[#F0FDF4]" style="border:2px solid var(--color-border-soft)">
                    <span class="text-xs font-semibold text-accent-dark">{{ r.region }} · {{ r.category }}</span>
                    <div class="text-xs opacity-65 leading-snug mt-0.5">{{ r.rule }}</div>
                  </div>
                </div>
              </div>
              <div class="p4-col-3 p4-panel" style="display:flex;flex-direction:column">
                <div class="flex justify-between items-center mb-3">
                  <h3 class="panel__title" style="margin:0">锚点价格</h3>
                  <span class="panel__hint">官方</span>
                </div>
                <div class="p4-anchors">
                  <div v-for="a in anchors.slice(0, 3)" :key="a.name" class="p-2 rounded-lg" style="border:2px solid var(--color-border);background:var(--color-panel)">
                    <div class="text-[11px] opacity-60 leading-tight">{{ a.name }}</div>
                    <div class="text-sm font-bold tabular mt-0.5 text-accent-dark">{{ a.value }}<span class="text-[10px] opacity-50 ml-0.5">{{ a.unit }}</span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ===== Tab2 AI 交易决策（基本信息 + AI 对话） ===== -->
          <div v-show="tab==='decision'" class="flex flex-col" style="height: calc(100vh - 140px)">
            <!-- 顶部基本信息条 -->
            <div class="p4-grid mb-3 shrink-0">
              <div class="p4-col-3 p4-stat-card">
                <div class="p4-stat-value tabular">{{ fmtNum(pool.forecast, 0) }}</div>
                <div class="p4-stat-label">明日预测发电 · MWh</div>
              </div>
              <div class="p4-col-3 p4-stat-card">
                <div class="p4-stat-value tabular">{{ fmtNum(pool.flexible, 0) }}</div>
                <div class="p4-stat-label">可灵活交易 · MWh</div>
              </div>
              <div class="p4-col-3 p4-stat-card">
                <div class="p4-stat-value tabular">{{ fmtNum(pool.storage, 1) }}</div>
                <div class="p4-stat-label">储能可调 · MWh</div>
              </div>
              <div class="p4-col-3 p4-stat-card">
                <div class="p4-stat-value tabular">{{ midtermPct }}%</div>
                <div class="p4-stat-label">中长期锁定比例</div>
              </div>
            </div>

            <!-- AI 对话主体 -->
            <div class="p4-panel flex-1 min-h-0 flex flex-col overflow-hidden">
              <div class="flex justify-between items-center mb-3 shrink-0">
                <h2 class="panel__title" style="margin:0">AI 交易助手</h2>
                <span class="panel__hint">问 AI · 生成方案 · 推演情景</span>
              </div>
              <!-- 对话流 -->
              <div class="p4-lab-body flex-1 min-h-0" ref="labBody" style="max-height:none;height:auto">
                <div class="p4-msg p4-msg--ai">
                  我是 AI 交易助手。可以问我：<b>「生成明日交易方案」</b>、<b>「风速降 30% 会怎样？」</b>、<b>「有哪些交易规则？」</b>
                </div>
                <template v-for="(m, i) in labMessages" :key="i">
                  <div class="p4-msg p4-msg--user">{{ m.q }}</div>
                  <div class="p4-msg p4-msg--ai">
                    <!-- 推荐方案卡 -->
                    <template v-if="m.type === 'plan'">
                      <div class="flex items-center gap-2 mb-2">
                        <span class="badge badge--accent">AI 推荐</span>
                        <span class="font-bold">{{ m.name }}</span>
                      </div>
                      <div class="text-xs opacity-60 mb-2">{{ m.desc }}</div>
                      <div class="grid grid-cols-3 gap-2 mb-3">
                        <div class="p-2 rounded-lg" style="border:2px solid var(--color-border);background:var(--color-panel)">
                          <div class="text-[11px] opacity-55">预计收益</div>
                          <div class="font-extrabold tabular text-accent-dark">{{ fmtRev(m.revenue) }}</div>
                        </div>
                        <div class="p-2 rounded-lg" style="border:2px solid var(--color-border);background:var(--color-panel)">
                          <div class="text-[11px] opacity-55">基准收益</div>
                          <div class="font-bold tabular">{{ fmtRev(m.baselineRevenue) }}</div>
                        </div>
                        <div class="p-2 rounded-lg" style="border:2px solid var(--color-border);background:var(--color-panel)">
                          <div class="text-[11px] opacity-55">提升</div>
                          <div class="font-bold tabular text-accent-dark">{{ fmtRev(m.revenue - m.baselineRevenue) }}</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-3 mb-2">
                        <div class="flex-1">
                          <div class="flex justify-between text-[11px] mb-0.5">
                            <span class="opacity-55">中长期 {{ m.spot !== undefined ? 100 - m.spot : midtermPct }}%</span>
                            <span class="opacity-55">现货 {{ m.spot || spotPct }}%</span>
                          </div>
                          <div class="p4-bar-track"><div class="p4-bar-fill" :style="{width: (m.spot || spotPct) + '%'}"></div></div>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full" :style="{background: m.risk < 30 ? 'rgba(34,197,94,0.15)' : m.risk < 50 ? 'rgba(245,158,11,0.15)' : 'rgba(239,68,68,0.15)', color: m.risk < 30 ? '#15803C' : m.risk < 50 ? '#B45309' : '#DC2626'}">风险 {{ Math.round(m.risk) }}</span>
                      </div>
                      <div class="space-y-1 mb-2">
                        <div v-for="(r, ri) in m.reasons" :key="ri" class="text-xs flex items-start gap-1.5">
                          <span class="text-accent-dark font-bold">{{ ri + 1 }}.</span>
                          <span class="opacity-75">{{ r }}</span>
                        </div>
                      </div>
                      <button class="btn btn--accent w-full !py-2 text-sm">确认此方案 · 加入今日任务</button>
                    </template>
                    <!-- 情景推演卡 -->
                    <template v-else-if="m.type === 'scene'">
                      <div class="font-semibold">{{ m.conclusion }}</div>
                      <div class="text-xs opacity-70 mt-1">{{ m.impact }}</div>
                      <div class="p4-lab-result">
                        <div class="p4-lab-result__row"><span class="k">发电</span><span class="v">{{ m.original.gen }} → {{ m.optimized.gen }} MWh</span></div>
                        <div class="p4-lab-result__row"><span class="k">现货比例</span><span class="v">{{ m.original.spot }}% → {{ m.optimized.spot }}%</span></div>
                        <div class="p4-lab-result__row"><span class="k">预计收益</span><span class="v">{{ fmtRev(m.original.revenue) }} → {{ fmtRev(m.optimized.revenue) }}</span></div>
                      </div>
                      <span class="p4-lab-conf">置信度 {{ m.confidence }}% · {{ m.model }}</span>
                    </template>
                    <!-- 规则消息 -->
                    <template v-else-if="m.type === 'rule'">
                      <div class="font-semibold mb-2">{{ m.conclusion }}</div>
                      <div class="space-y-1.5">
                        <div v-for="r in marketRules" :key="r.region + r.category" class="text-xs p-2 rounded-lg" style="border:2px solid var(--color-border-soft);background:var(--color-panel)">
                          <span class="font-semibold text-accent-dark">{{ r.region }} · {{ r.category }}</span>
                          <div class="opacity-70 mt-0.5">{{ r.rule }}</div>
                        </div>
                      </div>
                    </template>
                    <!-- 纯文本 -->
                    <template v-else>{{ m.conclusion }}</template>
                  </div>
                </template>
              </div>
              <!-- 预设问题 -->
              <div class="p4-presets flex flex-wrap gap-2 mb-3 shrink-0">
                <button class="p4-chip" @click="sendPreset('帮我生成明天的交易方案')">生成交易方案</button>
                <button class="p4-chip" @click="sendPreset('如果风速降 30% 会怎样')">风速骤降推演</button>
                <button class="p4-chip" @click="sendPreset('现在有哪些交易规则')">交易规则</button>
                <button class="p4-chip" @click="sendPreset('现货价格上涨会有什么影响')">现货上涨推演</button>
              </div>
              <!-- 输入框 -->
              <div class="flex gap-2 shrink-0">
                <input id="p4-lab-input" ref="labInput" placeholder="问 AI：如『帮我生成明日交易方案』『储能容量降20%会怎样』" @keydown.enter="sendLab" class="flex-1" />
                <button id="p4-lab-send" @click="sendLab">发送</button>
              </div>
            </div>
          </div>

        </main>
      `,
    });

    app.mount('#app');
  </script>
</body>
</html>

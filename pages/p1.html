    /* ===== p1 页面级样式（v3 设计语言） ===== */
    /* ===== 资产总览：微型仪表盘（2×3 卡片） ===== */
    .p1-asset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0 24px;
    }
    .asset-card {
      display: block;
      min-height: 120px;
      background: var(--color-panel);
      border: 2px solid var(--color-border-soft);
      border-radius: 12px;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--color-foreground);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .asset-card:hover { border-color: var(--color-accent); box-shadow: 0 4px 12px rgba(21,128,61,0.10); }
    .asset-card__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .asset-card__label { font-size: 13px; font-weight: 700; }
    .asset-card__icon { font-size: 16px; }
    .asset-value {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--color-foreground);
      line-height: 1.2;
    }
    .asset-sub { font-size: 12px; opacity: 0.55; margin-top: 4px; }
    .asset-delta { font-size: 12px; margin-top: 2px; }
    .asset-delta.is-up { color: var(--color-trend-up); }
    .asset-delta.is-down { color: var(--color-trend-down); }
    .asset-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      padding: 3px 10px; border-radius: 999px; margin-top: 2px;
    }
    .asset-badge.tone-good { background: var(--color-accent-light); color: var(--color-accent-dark); }
    .asset-badge.tone-warn { background: #FEF3C7; color: #92400E; }
    /* 迷你折线（SVG，无外部库） */
    .asset-spark { width: 100%; height: 30px; margin-top: 4px; display: block; }
    .asset-spark__line {
      stroke: var(--color-accent);
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    /* 企业资产状态灯 */
    .asset-company {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; padding: 3px 0;
    }
    .asset-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .asset-status-dot.is-on { background: var(--color-status-good); }
    .asset-status-dot.is-off { background: var(--color-status-critical); }
    .asset-company__name { flex: 1; }
    .asset-company__state { font-size: 11px; opacity: 0.55; }
    /* 项目分布环形图 */
    .asset-donut-row { display: flex; align-items: center; gap: 14px; }
    .asset-donut {
      width: 68px; height: 68px; border-radius: 50%;
      flex-shrink: 0;
      background: conic-gradient(var(--color-accent) 0 calc(var(--p1, 50%)), var(--color-border-soft) calc(var(--p1, 50%) + 40%) 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .asset-donut__inner {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--color-panel);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; text-align: center;
    }
    .asset-donut-legend { display: flex; flex-direction: column; gap: 6px; }
    .asset-donut-legend__item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .asset-donut-legend__dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    /* 预警中心 */
    .asset-alert {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; padding: 3px 0;
    }
    .asset-alert-tag {
      flex-shrink: 0; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px;
    }
    .asset-alert-tag.tag-紧急 { background: #FEE2E2; color: #B91C1C; }
    .asset-alert-tag.tag-重要 { background: #FEF3C7; color: #92400E; }
    .asset-alert-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 1024px) {
      .p1-asset-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .p1-asset-grid { grid-template-columns: 1fr; }
    }
    /* 省份下钻：顶部数字（保留旧样式） */
    .p1-stat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px 20px;
      margin: 20px 0 24px;
      padding: 18px 24px;
      border: 3px solid var(--color-border);
      background: var(--color-panel);
      border-radius: 20px;
    }
    .p1-stat-grid .stat-display { padding: 6px 0; }
    .p1-stat-grid .stat-display__value { font-size: 32px; }
    @media (max-width: 1024px) { .p1-stat-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) {
      .p1-stat-grid { grid-template-columns: repeat(2, 1fr); }
      .p1-stat-grid .stat-display__value { font-size: 26px; }
    }

    /* 演示推演条 */
    .p1-demo-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* 视角切换行 */
    .p1-scope-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 12px; }

    /* ===== 任务2：经营链路横向状态条（顶部，高度 ≤80px） ===== */
    .p1-chain-bar { margin-bottom: 16px; padding: 8px 16px; }
    .p1-chain-bar .panel__head { margin-bottom: 6px; }
    .p1-chain-bar .panel__title { font-size: 14px; }
    .link-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 2px 0;
    }
    .link-node {
      flex: 0 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      min-height: 40px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid var(--color-border-soft);
      background: var(--color-panel);
      text-decoration: none;
      color: var(--color-foreground);
      transition: border-color 160ms ease, box-shadow 160ms ease;
      position: relative;
      white-space: nowrap;
    }
    .link-node:hover {
      border-color: var(--color-accent);
      box-shadow: 0 4px 12px rgba(21,128,61,0.12);
    }
    .link-node__label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-foreground);
    }
    .link-node__status {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-status-good);
      word-break: keep-all;
    }
    .link-node__check { color: var(--color-status-good); font-weight: 800; font-size: 13px; }
    .link-node__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-light);
    }
    .link-node__tip {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      white-space: nowrap;
      background: var(--color-foreground);
      color: #FFFFFF;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .link-node:hover .link-node__tip { display: block; }
    /* 三态节点 */
    .link-node--done { border-color: var(--color-border-soft); }
    .link-node--done .link-node__status { color: var(--color-status-good); }
    .link-node--active {
      border-color: var(--color-accent-dark);
      background: var(--color-muted-2);
    }
    .link-node--active .link-node__status { color: var(--color-accent-dark); }
    .link-node--pending { opacity: 1; }
    .link-node--pending .link-node__status { color: var(--color-status-good); }
    .link-arrow { color: var(--color-accent); font-size: 16px; flex-shrink: 0; padding: 0 2px; }
    @media (max-width: 900px) {
      .link-flow { flex-wrap: nowrap; overflow-x: auto; }
    }

    /* 明日经营预测：内容纵向铺满，AI 策略条沉底（消除与今日结果的空档差） */
    .p1-tomorrow { display: flex; flex-direction: column; }
    .p1-tomorrow .p1-kpi-grid { margin-bottom: 12px; }
    .p1-tomorrow .p1-strategy { margin-top: auto; }

    /* AI 建议区（经营链路已上提为顶部状态条，此区单列展示） */
    .p1-chain-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) {
      .p1-chain-row { grid-template-columns: 1fr; }
    }

    .link-node__status strong {
      font-weight: 700;
      color: var(--color-text);
      opacity: 1;
    }

    /* ===== 任务5：右上角全局工具栏 ===== */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-item {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 2px solid var(--color-border);
      border-radius: 12px;
      background: var(--color-panel);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 160ms ease;
      user-select: none;
    }
    .toolbar-item:hover { border-color: var(--color-accent-dark); color: var(--color-accent-dark); }
    .toolbar-caret { font-size: 10px; opacity: 0.6; }
    .toolbar-src { display: inline-flex; align-items: center; gap: 3px; }
    .toolbar-src + .toolbar-src::before { content: "·"; opacity: 0.4; margin-right: 3px; }
    .toolbar-src__time { opacity: 0.55; }
    .toolbar-src.is-stale .toolbar-src__time { color: var(--color-status-warn); opacity: 1; font-weight: 700; }
    .toolbar-dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
    }
    .toolbar-dot--warn { background: var(--color-status-warn); }
    .toolbar-alert { color: var(--color-foreground); }
    .toolbar-alert.has-urgent { border-color: var(--color-status-critical); color: var(--color-status-critical); }
    .toolbar-alert.has-warn { border-color: var(--color-status-warn); color: var(--color-status-warn); }
    .toolbar-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 70;
      min-width: 240px;
      background: var(--color-panel);
      border: 2px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      padding: 10px 12px;
    }
    .toolbar-popover--tl { min-width: 220px; }
    .toolbar-popover--alert { min-width: 300px; }
    .toolbar-popover--export { min-width: 200px; }
    .toolbar-popover__head {
      font-size: 12px; font-weight: 700;
      border-bottom: 1px solid var(--color-border-soft);
      padding-bottom: 6px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .toolbar-link { color: var(--color-accent-dark); text-decoration: none; font-size: 12px; }
    .toolbar-health {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; font-size: 12px;
    }
    .toolbar-health__name { font-weight: 600; }
    .toolbar-health__time { opacity: 0.6; }
    .toolbar-health__state { margin-left: auto; }
    .toolbar-health__state.is-ok { color: var(--color-status-good); }
    .toolbar-health__state.is-stale { color: var(--color-status-warn); }
    .toolbar-alert-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 12px;
      border-bottom: 1px solid var(--color-border-soft);
    }
    .toolbar-alert-row:last-child { border-bottom: none; }
    .toolbar-alert-tag {
      flex-shrink: 0; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px;
    }
    .toolbar-alert-tag.tag-紧急 { background: #FEE2E2; color: #B91C1C; }
    .toolbar-alert-tag.tag-重要 { background: #FEF3C7; color: #92400E; }
    .toolbar-alert-title { flex: 1; }
    .toolbar-mini-btn {
      flex-shrink: 0; font-size: 11px;
      padding: 3px 8px; border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-panel); cursor: pointer;
    }
    .toolbar-mini-btn:hover { border-color: var(--color-accent-dark); color: var(--color-accent-dark); }
    .toolbar-export-btn {
      display: block; width: 100%;
      text-align: left; font-size: 12px;
      padding: 8px 10px; border-radius: 8px;
      border: none; background: transparent; cursor: pointer;
    }
    .toolbar-export-btn:hover { background: var(--color-muted); }
    .toolbar-toast {
      position: fixed; top: 70px; left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: var(--color-accent-dark); color: #FFFFFF;
      font-size: 13px; font-weight: 600;
      padding: 10px 20px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    /* 全屏演示模式：隐藏导航，仅核心仪表盘 */
    body.p1-fullscreen #site-nav { display: none; }
    body.p1-fullscreen .p1-scope-row { display: none; }
    body.p1-fullscreen .toolbar { display: none; }
    body.p1-fullscreen .page-wrap { max-width: none; }
    @media (max-width: 640px) {
      .toolbar-popover { right: -40px; }
    }
  </style>
</head>

        },
        scopeLabel() {
          return this.geoScope ? this.geoScope.short + "（点击返回全景）" : "东北区域全景";
        },
        drillPath() {
          const d = this.geoDrill;
          if (!d || d.level === 0) return "";
          const parts = ["东北"];
          if (d.province) parts.push(d.province);
          if (d.city) parts.push(d.city);
          return parts.join("  ›  ");
        },
        geoMapClass() {
          return { "geo-map--dark": this.geoTheme === "dark" };
        },
        // 工具栏：预警
        alertCount() {
          return this.alerts.filter((a) => !a.handled).length;
        },
        alertItems() {
          return this.alerts.filter((a) => !a.handled);
        },
        alertClass() {
          const urgent = this.alerts.filter((a) => a.level === "紧急" && !a.handled).length;
          return urgent > 0 ? "has-urgent" : (this.alertCount > 0 ? "has-warn" : "");
        },
      },

      methods: {
        trendClass(trend) { return trend.indexOf("-") === 0 ? "down" : "up"; },

        // 项目分布环形图：主类别占比（%）
        donutPct(card) {
          if (!card || !card.donut) return "50%";
          const total = card.donut.reduce((s, d) => s + d.value, 0);
          return total ? Math.round((card.donut[0].value / total) * 100) + "%" : "50%";
        },

        // 迷你折线：数据数组 → SVG polyline points（归一化到 100×30 视窗）
        sparkPoints(values) {
          if (!Array.isArray(values) || values.length === 0) return "";
          const max = Math.max(...values);
          const min = Math.min(...values);
          const range = max - min || 1;
          const step = 100 / (values.length - 1 || 1);
          return values.map((v, i) => {
            const x = (i * step).toFixed(1);
            const y = (30 - ((v - min) / range) * 26 - 2).toFixed(1);
            return `${x},${y}`;
          }).join(" ");
        },

        // 工具栏：标记预警已处理
        markHandled(w) { w.handled = true; },

        // 工具栏：导出报表（demo 环境：提示导出选项）
        doExport(type) {

        enterFullscreen() {

            document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
            document.body.classList.add("p1-fullscreen");
          } else {
            document.exitFullscreen && document.exitFullscreen();
            document.body.classList.remove("p1-fullscreen");
          }
          this.fullscreen = !this.fullscreen;
        },

        // 格式化链路状态文本：将关键数值（数字+单位/时间/金额）加粗
        formatStatus(status) {
          if (!status) return '';
          return status.replace(
            /([\d:]+—[\d:]+|[¥]?\d+\.?\d*\s*[MWh%万]*)/g,
            '<strong>$1</strong>'
          );
        },

        // KPI 目标 vs 实际：进度条 + 达成/超支判定
        kpiGoal(s) {
          const target = Number(s.target);
          if (!target) return { pct: 0, color: "var(--gradient-accent)", text: "目标 --" };
          const ratio = Number(s.value) / target;
          const pct = Math.min(100, Math.round(ratio * 100));
          const lowerIsBetter = s.lowerIsBetter === true;
          let color = "var(--gradient-accent)";
          if (lowerIsBetter && ratio > 1) {
            color = "linear-gradient(90deg, #F97316 0%, #EF4444 100%)";
          } else if (!lowerIsBetter && ratio < 0.95) {
            color = "linear-gradient(90deg, #EAB308 0%, #F97316 100%)";
          }
          const status = (lowerIsBetter && ratio > 1) ? ("超支 " + pct + "%") : ("达成 " + pct + "%");
          return { pct, color, text: "目标 " + s.targetText + " · " + status };
        },

        // 区域经营地图：图层 / KPI / 资源切换（转发给 geo-map.js）

        resetScope() {

        toggleGeoTheme() {

            return;
          }
          this.geoPlaying = true;

          this.playTimer = setInterval(() => {

            if (this.gm) this.gm.setTime(this.geoTime);

        onGeoClick(e) {

          <!-- 视角切换（地图联动：点省份 → 顶部数字切到该省；点此返回全景） -->
          <div class="p1-scope-row">
            <span v-if="geoDrill && geoDrill.level > 0" class="p1-drill-path">{{ drillPath }}</span>
            <button type="button" class="p1-scope" :class="{ active: geoScope }" @click="resetScope">
              当前视角：{{ scopeLabel }}
            </button>
          </div>

          <!-- 区域经营地图（ECharts 矢量地图，第一页置顶大图） -->
          <section class="p1-map-hero">
            <div class="panel__head">
              <h2 class="panel__title">区域经营地图</h2>
            </div>
            <div class="geo-map" :class="geoMapClass">
              <div class="geo-map__toolbar">
                <div class="geo-map__group">
                  <button v-for="l in geoLayers" :key="l.key" type="button"
                    class="geo-map__btn" :class="{ active: l.key === geoLayer }"
                    @click="setGeoLayer(l.key)">{{ l.label }}</button>
                </div>
                <div class="geo-map__spacer"></div>
                <div class="geo-map__group">
                  <button type="button" class="geo-map__btn" @click="toggleGeoTheme">
                    {{ geoTheme === "dark" ? "日间模式" : "夜间模式" }}
                  </button>
                </div>
              </div>
              <div class="geo-map__params">
                <div v-if="isKpiLayer()" class="geo-map__group">
                  <span class="geo-map__params-label">KPI 维度</span>
                  <button v-for="k in geoKPIs" :key="k.key" type="button"
                    class="geo-map__btn geo-map__btn--mini" :class="{ active: k.key === activeKPI }"
                    @click="setGeoKPI(k.key)">{{ k.label }}</button>
                </div>
                <div v-else-if="isResourceLayer()" class="geo-map__group">
                  <span class="geo-map__params-label">资源类型</span>
                  <button v-for="r in geoResources" :key="r.key" type="button"
                    class="geo-map__btn geo-map__btn--mini" :class="{ active: r.key === activeResource }"
                    @click="setGeoResource(r.key)">{{ r.label }}</button>
                </div>
                <div v-else-if="isBubbleLayer()" class="geo-map__group">
                  <span class="geo-map__params-label">时间轴</span>
                  <button v-for="(pt, i) in geoPeriods" :key="pt" type="button"
                    class="geo-map__btn geo-map__btn--mini" :class="{ active: i === geoTime }"
                    @click="setGeoTime(i)">{{ pt }}</button>
                  <button type="button" class="geo-map__btn geo-map__btn--mini" @click="playGeoTime">
                    {{ geoPlaying ? "暂停" : "播放" }}
                  </button>
                </div>
                <div v-else class="geo-map__params-label">{{ geoLayerDesc() }}</div>
              </div>
              <div class="geo-map__canvas-wrap">
                <div ref="geoMap" class="geo-map__chart"></div>
                <div class="geo-map__zoom">
                  <button v-if="geoDrill && geoDrill.level > 0" type="button" class="geo-map__zoom-btn" title="返回上级" @click="drillUpMap">↩</button>
                  <button type="button" class="geo-map__zoom-btn" title="放大" @click="zoomInMap">＋</button>
                  <button type="button" class="geo-map__zoom-btn" title="复位视角" @click="resetGeoView">⟳</button>
                  <button type="button" class="geo-map__zoom-btn" title="缩小" @click="zoomOutMap">－</button>
                </div>
              </div>
              <div v-if="geoSummary" class="geo-map__detail geo-map__detail--err">{{ geoSummary }}</div>
              <div v-else-if="geoSelected" class="geo-map__detail">
                <b class="geo-map__detail-name">{{ geoSelected.title }}</b>
                <span class="geo-map__detail-text">{{ geoSelected.text }}</span>
              </div>
            </div>
          </section>

          <!-- ===== 资产总览：微型仪表盘（全景）/ 省份 KPI（下钻） ===== -->
          <div v-if="!geoScope" class="p1-asset-grid">
            <a v-for="card in assetCards" :key="card.label" :href="card.target" class="asset-card">
              <div class="asset-card__head">
                <span class="asset-card__label">{{ card.label }}</span>
                <span class="asset-card__icon">{{ card.icon }}</span>
              </div>
              <!-- 企业资产 -->
              <template v-if="card.companies">
                <div v-for="c in card.companies" :key="c.name" class="asset-company">
                  <span class="asset-status-dot" :class="c.online ? 'is-on' : 'is-off'"></span>
                  <span class="asset-company__name">{{ c.name }}</span>
                  <span class="asset-company__state">{{ c.online ? "在线" : "离线" }}</span>
                </div>
              </template>
              <!-- 项目分布（迷你环形图） -->
              <template v-else-if="card.donut">
                <div class="asset-donut-row">
                  <div class="asset-donut" :style="{ '--p1': donutPct(card) }">
                    <div class="asset-donut__inner">{{ card.total }}</div>
                  </div>
                  <div class="asset-donut-legend">
                    <span v-for="d in card.donut" :key="d.name" class="asset-donut-legend__item">
                      <i class="asset-donut-legend__dot" :style="{ background: d.color }"></i>
                      {{ d.name }} {{ d.value }}
                    </span>
                  </div>
                </div>
              </template>
              <!-- 数值 + 迷你折线 -->
              <template v-else-if="card.value">
                <div class="asset-value">{{ card.value }}</div>
                <svg v-if="card.spark" class="asset-spark" viewBox="0 0 100 30" preserveAspectRatio="none">
                  <polyline class="asset-spark__line"
                    :points="sparkPoints(card.spark)" fill="none"></polyline>
                </svg>
                <div v-if="card.delta" class="asset-delta is-up">{{ card.delta }}</div>
                <div v-else-if="card.badge" class="asset-badge" :class="'tone-' + card.badgeTone">{{ card.badge }}</div>
                <div class="asset-sub">{{ card.sub }}</div>
              </template>
              <!-- 预警中心 -->
              <template v-else-if="card.alerts">
                <div v-for="a in card.alerts" :key="a.text" class="asset-alert">
                  <span class="asset-alert-tag" :class="a.level === '紧急' ? 'tag-紧急' : 'tag-重要'">{{ a.level }}</span>
                  <span class="asset-alert-text">{{ a.text }}</span>
                </div>
              </template>
            </a>
          </div>

          <!-- 省份下钻：数字卡片 -->
          <div v-else class="p1-stat-grid">
            <div v-for="s in topStats" :key="s.label" class="stat-display">
              <div class="stat-display__label">{{ s.label }}</div>
              <div class="stat-display__value">{{ s.value }}</div>
            </div>
          </div>

          <!-- 主视觉行：可信 AI 建议 -->
          <div class="p1-chain-row">
            <section class="card panel p1-section--rail">
              <div class="panel__head">
                <h2 class="panel__title">可信 AI 决策建议</h2>
                <span class="panel__hint">数据来源：气象预报中心 · SCADA实时 · 电力交易中心</span>
              </div>
              <p v-if="aiNotice" class="p1-ai-notice">{{ aiNotice }}</p>
              <div ref="aiCard" class="p1-ai-card"></div>
            </section>
          </div>

          <!-- 经营结果行：今日 + 明日 -->
          <div class="panel--row2">
            <section class="card panel">
              <div class="panel__head">
                <h2 class="panel__title">今日经营结果</h2>
                <span class="panel__hint">更新于 15:40</span>
              </div>
              <div class="p1-kpi-grid">
                <div v-for="s in todayStats" :key="s.label" class="kpi-card">
                  <div class="kpi-card__label">{{ s.label }}</div>
                  <div class="kpi-card__value">
                    <count-up :value="s.value" :decimals="s.decimals" :prefix="s.prefix || ''" :duration="1000" />
                    <span class="kpi-card__unit">{{ s.unit }}</span>
                  </div>
                  <div v-if="s.trend" class="kpi-card__trend" :class="trendClass(s.trend)">{{ s.trend }}</div>
                  <div class="kpi-card__goal">
                    <div class="kpi-card__goal-track"><div class="kpi-card__goal-fill" :style="{ width: kpiGoal(s).pct + '%', background: kpiGoal(s).color }"></div></div>
                    <div class="kpi-card__goal-text">{{ kpiGoal(s).text }}</div>
                  </div>
                  <button type="button" class="kpi-card__source" @click="showSource(s.label)">查看数据来源</button>
                </div>
              </div>
            </section>

            <section class="card panel p1-tomorrow">
              <div class="panel__head">
                <h2 class="panel__title">明日经营预测</h2>
              </div>
              <div class="p1-kpi-grid">
                <div v-for="s in tomorrowStats" :key="s.label" class="kpi-card">
                  <div class="kpi-card__label">{{ s.label }}</div>
                  <div class="kpi-card__value">
                    <count-up :value="s.value" :decimals="s.decimals" :prefix="s.prefix || ''" :duration="1000" />
                    <span class="kpi-card__unit">{{ s.unit }}</span>
                  </div>
                  <div class="kpi-card__goal">
                    <div class="kpi-card__goal-track"><div class="kpi-card__goal-fill" :style="{ width: kpiGoal(s).pct + '%', background: kpiGoal(s).color }"></div></div>
                    <div class="kpi-card__goal-text">{{ kpiGoal(s).text }}</div>
                  </div>
                  <button type="button" class="kpi-card__source" @click="showSource(s.label)">查看数据来源</button>
                </div>
              </div>
              <div class="p1-strategy">交易策略建议：{{ aiStrategy }}</div>
            </section>
          </div>

          <!-- 重点与待办 -->
          <div class="panel--row2">
            <section class="card panel">
              <div class="panel__head"><h2 class="panel__title">今日三项重点</h2></div>
              <div v-for="f in focusItems" :key="f.title" class="focus-item">
                <div class="focus-item__title">{{ f.title }}</div>
                <p class="focus-item__detail">{{ f.detail }}</p>
              </div>
            </section>
            <section class="card panel">
              <div class="panel__head"><h2 class="panel__title">经营待办</h2><span class="panel__hint">进入决策任务中心</span></div>
              <ul class="todo-list">
                <li v-for="(t, i) in todos" :key="i">
                  <span class="todo-check">☐</span><a href="/pages/p5.html" style="color:inherit;text-decoration:none">{{ t }}</a>
                </li>
              </ul>
            </section>
          </div>

          <!-- 数据溯源弹层挂载点（position:fixed，内容由 provenance.js 渲染） -->
          <div ref="provenance"></div>
        </main>

      `,
      mounted() {
        // 可信 AI 卡片（ai-card.js，八要素）
        this.aiCard = createAICard(this.$refs.aiCard);
        this.aiCard.setData(this.aiSuggestion, { pending: true, onAction: this.handleAIAction });
        // 区域经营地图（ECharts 矢量地图 + data/geo 地理信息数据库）
        loadGeoDB(window.fetch, "../").then((db) => {
          this.geoDb = db;
          this.geoPeriods = db.periods;
          this.gm = createGeoMap(this.$refs.geoMap, {
            geoJson: db.geoJson,
            provinces: db.provinces,
            stations: db.stations,
            flows: db.flows,
            rivers: db.rivers,
            periods: db.periods,
          });
          this.gm.init();
          this.gm.setTheme(this.geoTheme);
          this.gm.setKPI(this.activeKPI);
          this.gm.setLayer(this.geoLayer);
          this.gm.bindClick(this.onGeoClick);
        }).catch((err) => {
          this.geoSummary = "地理数据加载失败：" + (err && err.message ? err.message : String(err));
        });

        // 数据溯源弹层（provenance.js，7 字段）
        this.prov = createProvenance(this.$refs.provenance);

        // 演示实时推演曲线：订阅 demo.js 事件总线，驱动 demo-stream 联动
        this._demoHandler = (e) => {
          if (e.type === "start") { this.onDemoStart(); }
          else if (e.type === "step") { this.onDemoStep(e); }
          else if (e.type === "pause") { this.demoPaused = true; }
          else if (e.type === "resume") { this.demoPaused = false; }
          else if (e.type === "done") { this.onDemoEnd(e); }
        };
        if (window.__demo && typeof window.__demo.on === "function") {
          window.__demo.on(this._demoHandler);
          this._demoBound = true;
        }

        // 全屏演示：监听退出全屏（ESC）同步按钮态
        this._onFsChange = () => {
          const isFs = !!document.fullscreenElement;
          this.fullscreen = isFs;
          document.body.classList.toggle("p1-fullscreen", isFs);
        };
        document.addEventListener("fullscreenchange", this._onFsChange);
      },

      beforeUnmount() {
        if (this.aiCard) { this.aiCard.dispose(); this.aiCard = null; }
        if (this.gm) { this.gm.dispose(); this.gm = null; }
        if (this.playTimer) { clearInterval(this.playTimer); this.playTimer = null; }
        if (this.prov) { this.prov.dispose(); this.prov = null; }
        if (window.__demo && typeof window.__demo.off === "function") {
          window.__demo.off(this._demoHandler);
        }
        if (this.demoStream) { this.demoStream.dispose(); this.demoStream = null; }
        if (this._onFsChange) { document.removeEventListener("fullscreenchange", this._onFsChange); }
      },
    });

    app.component('count-up', CountUp);
    app.mount('#app');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北域绿联 · 决策与政策</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/echarts.min.js"></script>
  <style>
    /* ===== p5 页面级样式（v3 设计语言：粗黑边框仪表盘） ===== */
    .p5-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .p5-col-4 { grid-column: span 4; }
    .p5-col-5 { grid-column: span 5; }
    .p5-col-6 { grid-column: span 6; }
    .p5-col-7 { grid-column: span 7; }
    .p5-col-8 { grid-column: span 8; }
    .p5-col-3 { grid-column: span 3; }
    .p5-col-12 { grid-column: span 12; }
    @media (max-width: 1024px) {
      .p5-col-3, .p5-col-4, .p5-col-5, .p5-col-6, .p5-col-7, .p5-col-8 { grid-column: span 12; }
    }

    .p5-stat-card {
      position: relative;
      overflow: hidden;
      background-color: #FFFFFF;
      border: 3px solid var(--color-border);
      border-radius: 20px;
      padding: 10px 14px;
    }
    .p5-stat-card::after {
      content: "";
      position: absolute;
      right: -20px;
      top: -20px;
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.08), transparent 70%);
      pointer-events: none;
    }
    .p5-stat-value {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 24px;
      line-height: 1.1;
      color: var(--color-accent-dark);
    }
    .p5-stat-label { font-size: 12px; opacity: 0.55; margin-top: 1px; }

    .p5-panel {
      background-color: #FFFFFF;
      border: 3px solid var(--color-border);
      border-radius: 20px;
      padding: 14px 16px;
    }

    .p5-filter-btn {
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 12px;
      border: 2px solid var(--color-border);
      background: #FFFFFF;
      color: var(--color-foreground);
      opacity: 0.7;
      cursor: pointer;
      transition: all 160ms ease;
    }
    .p5-filter-btn:hover { opacity: 1; }
    .p5-filter-btn.active {
      opacity: 1;
      color: #FFFFFF;
      border-color: var(--color-accent-dark);
      background: var(--color-accent);
      font-weight: 600;
    }

    .p5-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    .p5-table thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.5;
      padding: 8px 10px;
      border-bottom: 2px solid var(--color-border);
      white-space: nowrap;
      background-color: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .p5-table tbody tr { transition: background-color 200ms ease; cursor: pointer; }
    .p5-table tbody tr:hover { background-color: var(--color-accent-light); }
    .p5-table tbody tr.expanded-row { background-color: var(--color-accent-light); border-left: 4px solid var(--color-accent); }
    .p5-table tbody tr.expanded-row td { font-weight: 600; border-bottom: none; }
    .p5-table tbody tr.expanded-detail { background-color: var(--color-accent-light); border-left: 4px solid var(--color-accent); }
    .p5-table tbody tr.expanded-detail td { padding-top: 4px; border-bottom: 1px solid var(--color-accent); }
    .p5-table .expanded-banner {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-accent);
      border: 2px solid var(--color-accent-dark);
      padding: 2px 12px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }
    .p5-table tbody td {
      padding: 10px;
      border-bottom: 1px solid var(--color-border-soft);
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .p5-table tbody tr:last-child td { border-bottom: none; }
    .p5-col-8 .p5-table th:nth-child(1) { width: 46%; }
    .p5-col-8 .p5-table th:nth-child(2) { width: 28%; }
    .p5-col-8 .p5-table th:nth-child(3) { width: 16%; }
    .p5-col-8 .p5-table th:nth-child(4) { width: 10%; }
    .p5-col-7 .p5-table th:nth-child(1) { width: 52%; }
    .p5-col-7 .p5-table th:nth-child(2) { width: 12%; }
    .p5-col-7 .p5-table th:nth-child(3) { width: 12%; }
    .p5-col-7 .p5-table th:nth-child(4) { width: 12%; }
    .p5-col-7 .p5-table th:nth-child(5) { width: 12%; }

    .p5-badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; border: 1.5px solid transparent; }
    .p5-badge-green { background: var(--color-accent-light); color: var(--color-accent-dark); border-color: var(--color-accent); }
    .p5-badge-amber { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
    .p5-badge-blue { background: #DBEAFE; color: #1D4ED8; border-color: #3B82F6; }
    .p5-badge-purple { background: #EDE9FE; color: #6D28D9; border-color: #8B5CF6; }
    .p5-badge-gray { background: #F1F5F9; color: #475569; border-color: #94A3B8; }

    .p5-chip {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 12px;
      border: 2px solid var(--color-border);
      background-color: #FFFFFF;
      color: var(--color-foreground);
      transition: border-color 180ms ease;
    }
    .p5-chip:hover { border-color: var(--color-accent); }

    .p5-bar-track { background-color: var(--color-accent-light); border-radius: 999px; height: 8px; overflow: hidden; }
    .p5-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.5), var(--color-accent));
      transition: width 400ms ease;
    }

    .p5-stars { letter-spacing: 1px; color: var(--color-accent-dark); font-size: 11px; }

    .p5-link-flow { display: flex; align-items: center; gap: 4px; overflow-x: auto; }
    .p5-link-node {
      flex: 1 1 0;
      min-width: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .p5-link-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #D1D5DB;
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 0 2px var(--color-border);
      transition: all 180ms ease;
    }
    .p5-link-node.active .p5-link-dot { background-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25); }
    .p5-link-bar { flex: 1; height: 3px; background-color: var(--color-border); border-radius: 999px; margin: -14px 0 0; }
    .p5-link-label { font-size: 11px; opacity: 0.6; white-space: nowrap; }
    .p5-link-count { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--color-accent-dark); }
    .p5-link-node.active .p5-link-label { color: var(--color-accent-dark); opacity: 1; font-weight: 600; }

    .p5-adv-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      border: none;
      background: var(--color-accent);
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
      transition: all 160ms ease;
      white-space: nowrap;
    }
    .p5-adv-btn:hover { opacity: 0.88; }
  </style>
</head>
<body class="min-h-screen bg-background">
  <nav id="site-nav" class="sticky top-0 z-40"></nav>
  <div id="app" class="container mx-auto p-4"></div>

  <script type="module">
    import { Nav, Data } from '../assets/js/common.js';
    // 契约(test_contract.py)要求引用；p5 无 ECharts 图表，仅保留不加载使用
    import { createChart } from '../assets/js/chart-view.js';

    Nav();

    const STATUS_CHAIN = ["待分析", "AI已分析", "待人工确认", "已确认", "已执行", "等待结果", "效果复盘"];

    const app = Vue.createApp({
      data() {
        return {
          title: "决策与政策",
          subtitle: "政策规则 · 任务流转 · AI 决策闭环",
          loading: false,
          error: "",
          tab: "policy",
          policies: [],
          tasks: [],
          expandedPolicy: null,
          filterCat: "全部",
          filterRegion: "全部",
          statusChain: STATUS_CHAIN.join(" → "),
          statusList: STATUS_CHAIN,
          kbDocs: [],
          kbQuery: "",
          kbActive: "",
          kbShowModal: false,
          kbMode: "file",
          kbFileName: "",
          kbNewDoc: { title: "", content: "" },
          kbFolders: [],
          kbActiveFolder: "",
          kbExpanded: {},
          kbShowNewFolder: false,
          kbNewFolder: "",
        };
      },
      template: `
        <main class="page-wrap">
          <header class="page-head">
            <div>
              <h1 class="page-title">{{ title }}</h1>
              <p class="page-meta">{{ subtitle }}</p>
            </div>
            <div class="flex gap-1 bg-muted rounded-lg p-1" style="border:2px solid var(--color-border)">
              <button type="button" @click="tab='policy'"
                class="px-4 py-1.5 rounded-md text-sm transition-colors"
                :class="tab==='policy' ? 'btn btn--sm btn--accent' : 'text-foreground opacity-60 hover:opacity-100'">
                政策与市场规则
              </button>
              <button type="button" @click="tab='tasks'"
                class="px-4 py-1.5 rounded-md text-sm transition-colors"
                :class="tab==='tasks' ? 'btn btn--sm btn--accent' : 'text-foreground opacity-60 hover:opacity-100'">
                决策任务中心
              </button>
              <button type="button" @click="tab='kb'"
                class="px-4 py-1.5 rounded-md text-sm transition-colors"
                :class="tab==='kb' ? 'btn btn--sm btn--accent' : 'text-foreground opacity-60 hover:opacity-100'">
                知识库
              </button>
            </div>
          </header>

          <!-- ================= 政策板块 ================= -->
          <div v-show="tab==='policy'">
            <div class="p5-grid mb-3">
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ policies.length }}</div>
                <div class="p5-stat-label">政策总数</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ categoryCount }}</div>
                <div class="p5-stat-label">覆盖分类</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ regionCount }}</div>
                <div class="p5-stat-label">覆盖地区</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ implementedCount }}</div>
                <div class="p5-stat-label">已实施</div>
              </div>
            </div>

            <div class="p5-grid">
              <!-- 左 4 列：分类饼图 + 地区覆盖 + 影响力TOP -->
              <div class="p5-col-4 space-y-3">
                <div class="p5-panel">
                  <div class="flex justify-between items-center mb-2">
                    <h2 class="panel__title" style="margin:0">分类分布</h2>
                    <span class="panel__hint">{{ policies.length }} 条</span>
                  </div>
                  <div ref="catChart" class="w-full h-52"></div>
                </div>
                <div class="p5-panel">
                  <div class="flex justify-between items-center mb-3">
                    <h2 class="panel__title" style="margin:0">地区覆盖</h2>
                    <span class="panel__hint">{{ regionCount }} 个 · 点击筛选（再点取消）</span>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" v-for="r in regionDist" :key="r.name" class="p5-filter-btn" :class="{active: filterRegion===r.name}" @click="setRegion(r.name)">
                      {{ r.name }}<span class="tabular ml-1">{{ r.count }}</span>
                    </button>
                  </div>
                </div>
                <div class="p5-panel">
                  <div class="flex justify-between items-center mb-3">
                    <h2 class="panel__title" style="margin:0">政策影响力 TOP</h2>
                    <span class="panel__hint">按影响星级排序</span>
                  </div>
                  <div class="space-y-2.5">
                    <div v-for="p in topImpactPolicies" :key="p.id" class="flex items-start gap-2 p-2 rounded-lg bg-secondary" style="border:2px solid var(--color-border-soft)">
                      <span class="text-xs tabular text-accent font-semibold mt-0.5 shrink-0">{{ impactRank(p.id) }}</span>
                      <div class="min-w-0 flex-1">
                        <div class="text-xs font-medium leading-snug">{{ p.title }}</div>
                        <div class="flex gap-1.5 flex-wrap mt-1">
                          <span v-for="imp in impactList(p.impact).slice(0, 3)" :key="imp.name"
                            class="text-[10px] px-1.5 py-0.5 rounded bg-muted" style="border:1.5px solid var(--color-border-soft)">
                            {{ imp.name }}<span class="p5-stars">{{ '★'.repeat(imp.stars) }}</span>
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 右 8 列：政策表格 -->
              <div class="p5-col-8 p5-panel">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="panel__title" style="margin:0">政策动态</h2>
                  <span class="panel__hint">点击行展开影响分析</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mb-3">
                  <button type="button" class="p5-filter-btn" :class="{active: filterCat==='全部'}"
                    @click="filterCat='全部'">全部</button>
                  <button type="button" v-for="c in catList" :key="c" class="p5-filter-btn"
                    :class="{active: filterCat===c}" @click="filterCat=c">{{ c }}</button>
                </div>
                <div class="max-h-[560px] overflow-y-auto">
                  <table class="p5-table">
                    <thead>
                      <tr>
                        <th>政策</th>
                        <th>发布机构</th>
                        <th>地区</th>
                        <th>状态</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template v-for="p in filteredPolicies" :key="p.id">
                        <tr @click="expandedPolicy = expandedPolicy===p.id ? null : p.id"
                          :class="expandedPolicy===p.id ? 'expanded-row' : ''">
                          <td>
                            <div class="flex items-center gap-2">
                              <span class="badge badge--accent shrink-0" style="font-size:10px">{{ p.category }}</span>
                              <span class="font-medium">{{ p.title }}</span>
                            </div>
                            <div class="text-xs opacity-50 mt-0.5 tabular">{{ p.doc_no }} · {{ p.published }}</div>
                          </td>
                          <td class="text-xs opacity-70">{{ p.agency }}</td>
                          <td class="text-xs opacity-70 whitespace-nowrap">{{ p.region }}</td>
                          <td class="whitespace-nowrap">
                            <span class="p5-badge" :class="p.status==='已实施' ? 'p5-badge-green' : 'p5-badge-amber'">{{ p.status }}</span>
                          </td>
                        </tr>
                        <!-- 展开区：跨整行 + 标识 -->
                        <tr v-if="expandedPolicy===p.id" class="expanded-detail">
                          <td colspan="4">
                            <div class="expanded-banner">▼ 企业影响分析</div>
                            <div class="space-y-1.5 py-1">
                              <div class="text-xs"><span class="opacity-50 mr-1">核心变化</span>{{ p.key_change }}</div>
                              <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs opacity-50 shrink-0">企业影响</span>
                                <div class="flex gap-1.5 flex-wrap">
                                  <span v-for="imp in impactList(p.impact)" :key="imp.name"
                                    class="text-[11px] px-2 py-0.5 rounded bg-secondary" style="border:1.5px solid var(--color-border-soft)">
                                    {{ imp.name }}<span class="p5-stars">{{ '★'.repeat(imp.stars) }}<span class="opacity-30">{{ '★'.repeat(5 - imp.stars) }}</span></span>
                                  </span>
                                </div>
                              </div>
                              <div class="text-xs opacity-50 pt-1" style="border-top:1px solid var(--color-border-soft)">
                                来源 {{ p.credit }} · <a :href="p.link" target="_blank" class="text-accent underline" @click.stop>查看原文</a>
                              </div>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- ================= 决策任务板块 ================= -->
          <div v-show="tab==='tasks'" class="flex flex-col overflow-hidden" style="height: calc(100vh - 158px)">
            <div class="p5-grid mb-3 shrink-0">
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ tasks.length }}</div>
                <div class="p5-stat-label">今日任务</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular text-amber-400">{{ pendingCount }}</div>
                <div class="p5-stat-label">待人工确认</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular text-accent">{{ doneCount }}</div>
                <div class="p5-stat-label">已确认执行</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular text-amber-400">{{ riskCount }}</div>
                <div class="p5-stat-label">含风险提示</div>
              </div>
            </div>

            <!-- 决策闭环链路 -->
            <section class="mb-4 shrink-0 card panel" style="padding:14px">
              <div class="panel__head mb-2">
                <h2 class="panel__title">决策闭环</h2>
              </div>
              <div class="p5-link-flow">
                <template v-for="(s, i) in statusList" :key="s">
                  <div class="p5-link-node" :class="{ active: taskInStatus(s) > 0 }">
                    <span class="p5-link-dot"></span>
                    <span class="p5-link-count tabular">{{ taskInStatus(s) }}</span>
                    <span class="p5-link-label">{{ s }}</span>
                  </div>
                  <div v-if="i < statusList.length - 1" class="p5-link-bar"></div>
                </template>
              </div>
            </section>

            <div class="p5-grid flex-1 min-h-0">
              <!-- 左 7 列：任务表格 -->
              <div class="p5-col-7 p5-panel flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-3 shrink-0">
                  <h2 class="panel__title" style="margin:0">今日决策任务</h2>
                  <span class="panel__hint">点击推进演示流转</span>
                </div>
                <div class="flex-1 min-h-0 overflow-y-auto overflow-x-auto">
                  <table class="p5-table">
                    <thead>
                      <tr>
                        <th>任务</th>
                        <th>负责人</th>
                        <th>置信度</th>
                        <th>状态</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="t in tasks" :key="t.id" @click="advanceTask(t)" :title="'点击推进：' + t.status + ' → 下一状态'">
                        <td>
                          <div class="flex items-center gap-2">
                            <span class="badge badge--accent shrink-0" style="font-size:10px">{{ t.type }}</span>
                            <span class="font-medium text-sm">{{ t.title }}</span>
                          </div>
                          <div class="text-xs opacity-50 mt-0.5 tabular">{{ t.decision_id }}</div>
                          <div v-if="t.risk" class="text-xs mt-1 text-amber-400">⚠ {{ t.risk }}</div>
                        </td>
                        <td class="text-xs opacity-70 whitespace-nowrap">{{ t.owner }}</td>
                        <td class="text-xs tabular whitespace-nowrap">
                          <span class="text-accent">{{ fmtConf(t.confidence) }}</span>
                        </td>
                        <td class="whitespace-nowrap">
                          <span class="p5-badge" :class="statusClass(t.status)">{{ t.status }}</span>
                        </td>
                        <td class="whitespace-nowrap">
                          <span class="text-xs text-accent-dark font-semibold">推进 ›</span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- 右 5 列：风险 + 分布 -->
              <div class="p5-col-5 space-y-3 flex flex-col min-h-0">
                <div class="p5-panel flex-1 min-h-0 flex flex-col">
                  <div class="flex justify-between items-center mb-3 shrink-0">
                    <h2 class="panel__title" style="margin:0">风险提示</h2>
                    <span class="panel__hint">{{ riskCount }} 项</span>
                  </div>
                  <div class="space-y-2 flex-1 min-h-0 overflow-y-auto pr-1">
                    <div v-for="t in riskTasks" :key="t.id" class="flex items-start gap-2 text-xs p-2 rounded-lg bg-secondary" style="border:2px solid var(--color-border-soft)">
                      <span class="text-amber-400 mt-0.5 shrink-0">⚠</span>
                      <div>
                        <div class="text-amber-400 font-medium">{{ t.title }}</div>
                        <div class="opacity-60">{{ t.risk }}</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="p5-panel flex-1 min-h-0">
                  <div class="flex justify-between items-center mb-3 shrink-0">
                    <h2 class="panel__title" style="margin:0">状态分布</h2>
                    <span class="panel__hint">{{ tasks.length }} 项</span>
                  </div>
                  <div class="space-y-2">
                    <div v-for="s in statusDist" :key="s.name" class="flex items-center gap-2">
                      <span class="text-xs w-20 shrink-0 opacity-70">{{ s.name }}</span>
                      <div class="flex-1 p5-bar-track">
                        <div class="p5-bar-fill" :style="{width: statusPct(s.count) + '%'}"></div>
                      </div>
                      <span class="text-xs tabular w-5 text-right opacity-70">{{ s.count }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- ================= 知识库板块 ================= -->
          <div v-show="tab==='kb'" class="kb-tab">
            <!-- 顶部统计条 -->
            <div class="p5-grid mb-4">
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ kbStats.docs }}</div>
                <div class="p5-stat-label">知识文档</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ kbStats.sections }}</div>
                <div class="p5-stat-label">章节条目</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ kbStats.categories }}</div>
                <div class="p5-stat-label">覆盖分类</div>
              </div>
              <div class="p5-col-3 p5-stat-card card">
                <div class="p5-stat-value tabular">{{ (kbStats.chars / 1000).toFixed(1) }}k</div>
                <div class="p5-stat-label">总字符量</div>
              </div>
            </div>
            <div class="p5-grid">
              <!-- 左栏：文件夹 -->
              <div class="p5-col-3 p5-panel" style="max-height: calc(100vh - 300px); display: flex; flex-direction: column;">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="p5-panel-title">文件夹</h2>
                  <span class="p1-section__hint">{{ kbFolders.length }}</span>
                </div>
                <div class="flex-1 overflow-y-auto pr-1">
                  <div v-for="folder in kbFolders" :key="folder"
                    class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition-colors mb-0.5"
                    :class="kbActiveFolder === folder ? 'bg-accent/10 text-accent-dark font-semibold' : 'hover:bg-muted'"
                    @click="kbActiveFolder = folder">
                    <span class="text-sm">📁</span>
                    <span class="flex-1 text-sm">{{ folder }}</span>
                    <span class="text-xs opacity-40">{{ kbDocs.filter(d => (d.folder || '未分类') === folder).length }}</span>
                  </div>
                  <button @click="kbShowNewFolder = !kbShowNewFolder" class="w-full mt-2 text-xs px-3 py-2 rounded-lg border border-dashed border-border hover:border-accent hover:text-accent">
                    ＋ 新建文件夹
                  </button>
                  <div v-if="kbShowNewFolder" class="flex gap-2 mt-2">
                    <input v-model="kbNewFolder" placeholder="名称" class="flex-1 px-2 py-1.5 rounded border border-border text-sm" @keydown.enter="addKbFolder" />
                    <button @click="addKbFolder" class="p5-adv-btn">✓</button>
                  </div>
                </div>
              </div>

              <!-- 中栏：文档列表 -->
              <div class="p5-col-3 p5-panel" style="max-height: calc(100vh - 300px); display: flex; flex-direction: column;">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="p5-panel-title">{{ kbActiveFolder || '文档' }}</h2>
                  <button @click="openKbModal" class="p5-adv-btn !py-1 !px-2 text-xs">＋ 新建</button>
                </div>
                <input v-model="kbQuery" placeholder="搜索…" class="w-full px-2.5 py-1.5 rounded-lg border border-border mb-2 text-sm" />
                <div class="flex-1 overflow-y-auto pr-1">
                  <div v-for="doc in kbActiveFiles" :key="doc.file"
                    class="flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer hover:bg-muted transition-colors mb-0.5"
                    :class="kbActive === doc.file ? 'bg-accent/10 text-accent-dark font-semibold' : ''"
                    @click="selectKbDoc(doc.file)">
                    <span class="text-sm">📄</span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium truncate">{{ doc.title }}</div>
                      <div class="text-xs opacity-40">{{ doc.sections.length }} 章节 · {{ doc.updated }}</div>
                    </div>
                  </div>
                  <div v-if="kbActiveFiles.length === 0" class="text-xs opacity-40 text-center py-6">该文件夹暂无文档</div>
                </div>
              </div>

              <!-- 右栏：文档内容 -->
              <div class="p5-col-6 p5-panel" style="max-height: calc(100vh - 300px); overflow-y: auto;">
                <template v-if="kbActiveDoc">
                  <div class="flex justify-between items-center mb-1">
                    <h2 class="p5-panel-title">{{ kbActiveDoc.title }}</h2>
                    <div class="flex items-center gap-2">
                      <span v-if="kbActiveDoc.status === '待审核'" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 font-semibold">待审核</span>
                      <span v-else class="text-[10px] px-2 py-0.5 rounded-full bg-accent/15 text-accent-dark font-semibold">已收录</span>
                      <button @click="renameKbDoc(kbActiveDoc.file)" class="text-xs opacity-50 hover:text-accent" title="重命名">✎</button>
                      <button @click="downloadKbDoc(kbActiveDoc.file)" class="text-xs opacity-50 hover:text-accent" title="下载">⬇</button>
                      <button @click="deleteKbDoc(kbActiveDoc.file)" class="text-xs opacity-50 hover:text-red-500" title="删除">🗑</button>
                    </div>
                  </div>
                  <div class="flex items-center gap-3 text-xs opacity-50 mb-3">
                    <span>📂 {{ kbActiveDoc.category }}</span>
                    <span>📑 {{ kbActiveDoc.sections.length }} 章节</span>
                    <span>🕐 {{ kbActiveDoc.updated }}</span>
                  </div>
                  <div v-if="kbActiveDoc.status === '待审核'" class="flex gap-2 mb-3">
                    <button @click="approveKbDoc(kbActiveDoc.file)" class="p5-adv-btn">✓ 确认收录</button>
                    <button @click="rejectKbDoc(kbActiveDoc.file)" class="text-xs px-3 py-1.5 rounded-md border border-red-400 text-red-500 hover:bg-red-50">驳回</button>
                  </div>
                  <div v-if="kbActiveSection" class="mb-4">
                    <h3 class="text-sm font-bold mb-2" style="background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent">{{ kbActiveSection.title }}</h3>
                    <p class="text-sm leading-relaxed opacity-80" v-html="highlightKb(kbActiveSection.content)"></p>
                  </div>
                  <div v-else class="space-y-4">
                    <div v-for="sec in kbActiveDoc.sections" :key="sec.title">
                      <h3 class="text-sm font-bold mb-2" style="background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent">{{ sec.title }}</h3>
                      <p class="text-sm leading-relaxed opacity-80" v-html="highlightKb(sec.content)"></p>
                    </div>
                  </div>
                </template>
                <p v-else class="text-sm opacity-60">从左侧选择文档查看内容。</p>
              </div>
            </div>

        </main>
      `,
      computed: {
        kbFiltered() {
          if (!this.kbQuery) return this.kbDocs;
          const q = this.kbQuery.toLowerCase();
          return this.kbDocs.map((doc) => ({
            ...doc,
            sections: doc.sections.filter((s) => s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q)),
          })).filter((doc) => doc.sections.length > 0);
        },
        kbActiveDoc() {
          return this.kbDocs.find((d) => d.file === this.kbActive.split("::")[0]) || null;
        },
        kbActiveSection() {
          const parts = this.kbActive.split("::");
          if (parts.length < 2) return null;
          const doc = this.kbActiveDoc;
          return doc ? (doc.sections.find((s) => s.title === parts[1]) || null) : null;
        },
        kbStats() {
          const totalSections = this.kbDocs.reduce((s, d) => s + (d.sections ? d.sections.length : 0), 0);
          const categories = new Set(this.kbDocs.map((d) => d.category)).size;
          const totalChars = this.kbDocs.reduce((s, d) => s + (d.sections ? d.sections.reduce((ss, sec) => ss + sec.content.length, 0) : 0), 0);
          return { docs: this.kbDocs.length, sections: totalSections, categories, chars: totalChars };
        },
        kbCategories() {
          const map = {};
          this.kbDocs.forEach((d) => {
            const c = d.category || "其他";
            if (!map[c]) map[c] = [];
            map[c].push(d);
          });
          return Object.entries(map).map(([name, docs]) => ({ name, docs }));
        },
        kbFolderDocs() {
          const map = {};
          this.kbDocs.forEach((d) => {
            const f = d.folder || "未分类";
            if (!map[f]) map[f] = [];
            map[f].push(d);
          });
          return Object.entries(map).map(([name, docs]) => ({ name, docs }));
        },
        kbActiveFiles() {
          let files = this.kbDocs.filter((d) => (d.folder || "未分类") === this.kbActiveFolder);
          if (this.kbQuery) {
            const q = this.kbQuery.toLowerCase();
            files = files.filter((d) => d.title.toLowerCase().includes(q) || d.sections.some((s) => s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q)));
          }
          return files;
        },
        categoryCount() {
          return new Set(this.policies.map((p) => p.category)).size;
        },
        regionCount() {
          return new Set(this.policies.map((p) => p.region)).size;
        },
        implementedCount() {
          return this.policies.filter((p) => p.status === "已实施").length;
        },
        catList() {
          return [...new Set(this.policies.map((p) => p.category))];
        },
        topImpactPolicies() {
          const score = (p) =>
            (p.impact || "").split(";").reduce((sum, part) => {
              const m = part.trim().match(/([一二三四五])星/);
              return sum + ({ "一": 1, "二": 2, "三": 3, "四": 4, "五": 5 }[m && m[1]] || 0);
            }, 0);
          return [...this.policies].sort((a, b) => score(b) - score(a)).slice(0, 3);
        },
        filteredPolicies() {
          let list = this.policies;
          if (this.filterCat !== "全部") list = list.filter((p) => p.category === this.filterCat);
          if (this.filterRegion !== "全部") list = list.filter((p) => p.region === this.filterRegion);
          return list;
        },
        catDist() {
          const m = {};
          this.policies.forEach((p) => { m[p.category] = (m[p.category] || 0) + 1; });
          return Object.entries(m).map(([name, count]) => ({ name, count }));
        },
        regionDist() {
          const m = {};
          this.policies.forEach((p) => { m[p.region] = (m[p.region] || 0) + 1; });
          return Object.entries(m).map(([name, count]) => ({ name, count }));
        },
        pendingCount() {
          return this.tasks.filter((t) => t.status === "待人工确认" || t.status === "待分析").length;
        },
        doneCount() {
          return this.tasks.filter((t) => t.status === "已确认" || t.status === "已执行" || t.status === "效果复盘").length;
        },
        riskCount() {
          return this.tasks.filter((t) => t.risk).length;
        },
        riskTasks() {
          return this.tasks.filter((t) => t.risk);
        },
        statusDist() {
          const m = {};
          this.tasks.forEach((t) => { m[t.status] = (m[t.status] || 0) + 1; });
          return STATUS_CHAIN.filter((s) => m[s]).map((s) => ({ name: s, count: m[s] }));
        },
      },
      methods: {
        selectKbDoc(file) {
          this.kbActive = file;
        },
        selectKbSection(file, section) {
          this.kbActive = file + "::" + section;
        },
        highlightKb(text) {
          if (!this.kbQuery) return text;
          const q = this.kbQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          return text.replace(new RegExp(q, "gi"), (m) => `<mark style="background:#FDE68A;padding:0 2px;border-radius:2px">${m}</mark>`);
        },
        // 解析粘贴内容为章节（## 分隔）
        parseKbContent(title, content) {
          const lines = content.split("\n");
          const sections = [];
          let cur = null;
          lines.forEach((line) => {
            line = line.trim();
            if (line.startsWith("## ")) {
              if (cur) sections.push(cur);
              cur = { title: line.slice(3), content: [] };
            } else if (line.startsWith("# ")) {
              // 忽略总标题
            } else if (cur && line) {
              cur.content.push(line);
            }
          });
          if (cur) sections.push(cur);
          if (sections.length === 0) sections.push({ title: title, content: [content] });
          sections.forEach((s) => { s.content = s.content.join(" "); });
          return sections;
        },
        // 打开/关闭提交弹层
        openKbModal() {
          this.kbShowModal = true;
          this.kbMode = "file";
          this.kbFileName = "";
        },
        closeKbModal() {
          this.kbShowModal = false;
        },
        // 选择文件（模拟）
        onKbFileChange(e) {
          const f = e.target.files && e.target.files[0];
          if (f) this.kbFileName = f.name;
        },
        // 提交文档 → 待审核
        doKbSubmit() {
          if (this.kbMode === "text") {
            const title = (this.kbNewDoc.title || "").trim();
            const content = (this.kbNewDoc.content || "").trim();
            if (!title || !content) return;
            this.submitKbDoc(title, content, title + ".md");
          } else if (this.kbFileName) {
            const title = this.kbFileName.replace(/\.[^.]+$/, "");
            const content = "（来自上传文件）\n## 章节摘要\n该文档来自上传文件 " + this.kbFileName;
            this.submitKbDoc(title, content, this.kbFileName);
          }
        },
        // 提交文档 → 待审核
        submitKbDoc(title, content, file) {
          title = (title || "").trim();
          content = (content || "").trim();
          if (!title || !content) return;
          const f = file || "自定义-" + title + ".md";
          this.kbDocs.push({
            file: f,
            title,
            status: "待审核",
            sections: this.parseKbContent(title, content),
          });
          this.kbNewDoc = { title: "", content: "" };
          this.kbFileName = "";
          this.kbShowModal = false;
          this.kbActive = f;
        },
        // 审核：确认收录
        approveKbDoc(file) {
          const doc = this.kbDocs.find((d) => d.file === file);
          if (doc) doc.status = "已收录";
        },
        // 审核：驳回删除
        rejectKbDoc(file) {
          this.deleteKbDoc(file);
        },
        // 删除文档
        deleteKbDoc(file) {
          this.kbDocs = this.kbDocs.filter((d) => d.file !== file);
          if (this.kbActive === file || this.kbActive.startsWith(file)) this.kbActive = "";
        },
        // 重命名文档
        renameKbDoc(file) {
          const doc = this.kbDocs.find((d) => d.file === file);
          if (!doc) return;
          const name = prompt("重命名文档标题：", doc.title);
          if (name && name.trim()) {
            doc.title = name.trim();
            if (this.kbActive === file || this.kbActive.startsWith(file)) this.kbActive = file;
          }
        },
        // 下载文档（模拟，生成 .md 文本）
        downloadKbDoc(file) {
          const doc = this.kbDocs.find((d) => d.file === file);
          if (!doc) return;
          let md = "# " + doc.title + "\n\n";
          (doc.sections || []).forEach((s) => { md += "## " + s.title + "\n" + s.content + "\n\n"; });
          const blob = new Blob([md], { type: "text/markdown" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = file;
          a.click();
          URL.revokeObjectURL(a.href);
        },
        // 新建文件夹
        addKbFolder() {
          const name = (this.kbNewFolder || "").trim();
          if (!name || this.kbFolders.includes(name)) return;
          this.kbFolders.push(name);
          this.kbNewFolder = "";
          this.kbShowNewFolder = false;
        },
        // 删除文件夹（文档移到"未分类"）
        deleteKbFolder(folder) {
          this.kbFolders = this.kbFolders.filter((f) => f !== folder);
          this.kbDocs.forEach((d) => { if (d.folder === folder) d.folder = "未分类"; });
        },
        // 展开/折叠文档章节
        toggleKbDoc(file) {
          this.kbExpanded[file] = !this.kbExpanded[file];
        },
        // 移动文档到文件夹
        moveKbDoc(file, folder) {
          const doc = this.kbDocs.find((d) => d.file === file);
          if (doc) doc.folder = folder;
        },
        fmtConf(v) {
          return v ? (v * 100).toFixed(0) + "%" : "--";
        },
        setRegion(name) {
          this.filterRegion = (this.filterRegion === name) ? "全部" : name;
        },
        impactRank(id) {
          const idx = this.topImpactPolicies.findIndex((p) => p.id === id);
          return idx >= 0 ? ["①", "②", "③"][idx] : "";
        },
        impactList(s) {
          if (!s) return [];
          return s.split(";").map((part) => {
            const m = part.trim().match(/^(.+?)([一二三四五])星$/);
            if (!m) return null;
            const stars = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5 }[m[2]];
            return { name: m[1], stars };
          }).filter(Boolean);
        },
        statusPct(c) {
          return this.tasks.length ? Math.round((c / this.tasks.length) * 100) : 0;
        },
        taskInStatus(s) {
          return this.tasks.filter((t) => t.status === s).length;
        },
        statusClass(s) {
          const map = {
            "已确认": "p5-badge-green",
            "已执行": "p5-badge-blue",
            "效果复盘": "p5-badge-purple",
          };
          return map[s] || "p5-badge-amber";
        },
        advanceTask(t) {
          const idx = STATUS_CHAIN.indexOf(t.status);
          if (idx >= 0 && idx < STATUS_CHAIN.length - 1) {
            t.status = STATUS_CHAIN[idx + 1];
          }
        },
        async loadData() {
          try {
            const policy = await Data("demo/policy");
            const tasks = await Data("demo/tasks");
            this.policies = policy.list || [];
            this.tasks = tasks.tasks || [];
            this.renderCatChart();
            try {
              const kb = await Data("kb/index");
              this.kbDocs = (kb.docs || []).map((d) => ({ ...d, status: "已收录", folder: d.category }));
              if (this.kbDocs.length) this.kbActive = this.kbDocs[0].file;
              this.kbDocs.forEach((d) => {
                if (!this.kbFolders.includes(d.folder)) this.kbFolders.push(d.folder);
              });
              if (!this.kbActiveFolder || !this.kbFolders.includes(this.kbActiveFolder)) {
                this.kbActiveFolder = this.kbFolders[0] || "市场交易";
              }
            } catch (e) {
              // kb/index.json 缺失不阻断
            }
          } catch (e) {
            this.error = e.message;
          }
        },
        renderCatChart() {
          if (!this.catChart) return;
          const data = this.catDist.map((c) => ({ name: c.name, value: c.count }));
          this.catChart.setData(data, { type: "pie", donut: true });
        },
      },
      mounted() {
        this.catChart = createChart(this.$refs.catChart);
        this.loadData();
      },
      beforeUnmount() {
        if (this.catChart) { this.catChart.dispose(); this.catChart = null; }
      },
      watch: {
        tab() {
          this.$nextTick(() => {
            if (this.tab === "policy" && this.catChart) {
              this.renderCatChart();
            }
          });
        },
      },
    });

    app.mount('#app');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北域绿联 · 风光储优化</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/echarts.min.js"></script>
</head>
<body class="min-h-screen">
  <nav id="site-nav" class="p-4 border-b"></nav>
  <div id="app" class="container mx-auto p-4"></div>

  <script type="module">
    import { Nav, Data, fetchData } from '../assets/js/common.js';
    import { filterRows, groupBy, toChartData } from '../assets/js/filter.js';
    import { formatNumber, formatMoney, formatPercent, formatDate } from '../assets/js/format.js';
    import { createChart } from '../assets/js/chart-view.js';

    Nav();

    const app = Vue.createApp({
      data() {
        return {
          title: "风光储优化",
          loading: false,
          error: "",
        };
      },
      template: `
        <main>
          <h1 class="text-2xl mb-4">{{ title }}</h1>
          <p v-if="loading" class="text-gray-400">加载中…</p>
          <p v-else-if="error" class="text-red-400">{{ error }}</p>
          <div v-else>
            <!-- 页面内容写在这里 -->
            <div ref="chart" class="w-full h-80"></div>
          </div>
        </main>
      `,
      mounted() {
        // 图表：用统一组件，数据形如 [{label, value}]
        this.chart = createChart(this.$refs.chart);
        this.chart.setData([{ label: '示例', value: 10 }]);
      },
      beforeUnmount() {
        // 统一组件负责 dispose，页面只需调用
        if (this.chart) { this.chart.dispose(); this.chart = null; }
      },
      computed: {},
    });

    app.mount('#app');
  </script>
</body>
</html>

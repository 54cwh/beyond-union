<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北域绿联 · 发电预测</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/echarts.min.js"></script>
  <style>
    /* ===== p2 页面级样式（v3 设计语言：固定数据艺术字 + 粗黑边框仪表盘）===== */
    .p2-page { max-width: 1240px; margin: 0 auto; padding: 20px 16px 56px; }
    .p2-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .p2-title { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
    .p2-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #6B7280; }

    /* 固定数据艺术字区（直接浮在噪点背景上，不套卡片） */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px 20px;
      margin: 20px 0 28px;
      padding: 20px 24px;
      border: 3px solid var(--color-border);
      background: var(--color-panel);
      border-radius: 20px;
    }
    .stat-grid .stat-display { padding: 8px 0; }
    .stat-grid .stat-display__value { font-size: 38px; }
    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-grid .stat-display__value { font-size: 30px; }
    }

    /* 仪表盘面板 */
    .panel { margin-bottom: 20px; }
    .panel--row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .panel--row2 { grid-template-columns: 1fr; } }

    /* 风险时间轴 */
    .risk-bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; border: 1px solid var(--color-border-soft); }
    .risk-bar__seg { cursor: pointer; transition: filter 150ms ease; }
    .risk-bar__seg:hover { filter: brightness(1.08); }
    .risk-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #6B7280; }
    .risk-legend__dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .risk-ticks { display: flex; justify-content: space-between; font-size: 11px; color: #6B7280; font-variant-numeric: tabular-nums; }

    /* 模型验证表 */
    .v-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .v-table th { text-align: left; font-size: 12px; color: #6B7280; font-weight: 600; padding: 8px 6px; border-bottom: 2px solid var(--color-border); }
    .v-table td { padding: 9px 6px; border-bottom: 1px solid var(--color-border-soft); font-variant-numeric: tabular-nums; }
    .v-table tr:last-child td { border-bottom: none; }
    .v-table td.num { text-align: right; font-weight: 700; }

    /* 经营影响按钮行 */
    .action-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  </style>
</head>
<body class="min-h-screen bg-background">
  <nav id="site-nav" class="sticky top-0 z-40"></nav>
  <div id="app" class="container mx-auto p-4"></div>

  <script type="module">
    import { Nav, Data } from '../assets/js/common.js';
    import { formatNumber, formatPercent } from '../assets/js/format.js';
    import { createChart } from '../assets/js/chart-view.js';
    import { createAICard } from '../assets/js/ai-card.js';
    import { createProvenance } from '../assets/js/provenance.js';

    Nav();

    // ===== 风险分级临时规则（pages/p2.md 3.2：阈值抽配置常量，待 A 提供 classifyRisk 后替换）=====
    const RISK_RULES = {
      high: { bandwidthPct: 15, label: '预测不确定性高', color: '#D95926' },
      mid: { bandwidthPct: 10, label: '波动加大', color: '#CA8A04' },
      low: { label: '低风险', color: '#16A34A' },
    };
    // 时间尺度：7D 需 168h，数据仅 96h → 7D 置灰
    const SCALE_HOURS = { '24H': 24, '48H': 48, '7D': 168 };

    const app = Vue.createApp({
      data() {
        return {
          title: "发电预测中心",
          loading: true,
          error: "",
          scale: "24H",
          gen: null,
          weather: null,
          market: null,
          factors: [
            { name: '风速', value: 42 },
            { name: '风向', value: 16 },
            { name: '设备可用率', value: 15 },
            { name: '温度', value: 9 },
            { name: '气压', value: 8 },
            { name: '其他', value: 10 },
          ],
          forecastChart: null,
          priceChart: null,
          factorChart: null,
          card: null,
          prov: null,
        };
      },
      template: `
        <main class="p2-page">
          <!-- 头部：标题 + 数据更新/可信等级 -->
          <div class="p2-head">
            <div>
              <h1 class="p2-title">{{ title }}</h1>
              <div class="p2-meta">
                <span v-if="gen">数据更新 {{ gen.meta.updated }} · {{ gen.meta.level }}</span>
                <span v-if="isLevel1" class="badge badge--accent">已上线</span>
              </div>
            </div>
            <div class="p2-meta">
              <button v-if="gen" class="btn btn--sm btn--ghost" @click="showSource">查看数据来源</button>
            </div>
          </div>

          <!-- 加载 / 错误态 -->
          <p v-if="loading" class="text-gray-400">加载中…</p>
          <div v-else-if="error" class="text-red-400">
            <p>{{ error }}</p>
            <button class="btn btn--accent mt-3" @click="loadData">重试</button>
          </div>

          <template v-else>
            <!-- ===== 固定数据区：艺术字直接展示（不加卡片） ===== -->
            <div class="stat-grid">
              <div class="stat-display stat-display--accent">
                <div class="stat-display__label">未来 24h 预计发电</div>
                <div class="stat-display__value">{{ todayKpis[0].value }}<span class="unit">MWh</span></div>
                <div class="stat-display__sub">风 {{ todayKpis[0].wind }} · 光 {{ todayKpis[0].pv }}</div>
              </div>
              <div class="stat-display">
                <div class="stat-display__label">预测置信度</div>
                <div class="stat-display__value">{{ todayKpis[1].value }}</div>
                <div class="stat-display__sub">模型输出可信度</div>
              </div>
              <div class="stat-display">
                <div class="stat-display__label">预计最大偏差</div>
                <div class="stat-display__value">{{ todayKpis[2].value }}<span class="unit">%</span></div>
                <div class="stat-display__sub">置信区间带宽</div>
              </div>
              <div class="stat-display stat-display--accent">
                <div class="stat-display__label">可交易电量</div>
                <div class="stat-display__value">{{ todayKpis[3].value }}<span class="unit">MWh</span></div>
                <div class="stat-display__sub">进入市场口径</div>
              </div>
              <div class="stat-display">
                <div class="stat-display__label">可调储能</div>
                <div class="stat-display__value">{{ todayKpis[4].value }}<span class="unit">MWh</span></div>
                <div class="stat-display__sub">可调度空间</div>
              </div>
            </div>

            <!-- ===== 仪表盘区 ===== -->
            <!-- 主预测图 -->
            <section class="card panel">
              <div class="panel__head">
                <h2 class="panel__title">主预测图（实际 / 预测 / 置信区间）</h2>
                <div class="flex gap-1 text-sm">
                  <button v-for="s in ['24H','48H','7D']" :key="s" @click="setScale(s)"
                    :disabled="s === '7D' && !can7D"
                    :title="s === '7D' && !can7D ? '当前仅提供 96 小时预测，待数据扩充后开放' : ''"
                    :class="scale === s ? 'btn btn--sm btn--accent' : 'btn btn--sm btn--ghost'">
                    {{ s }}
                  </button>
                </div>
              </div>
              <div ref="forecastChart" class="w-full h-80"></div>
              <p class="panel__hint mt-2">置信区间为 ±8.4%；7D 需 168h 数据</p>
            </section>

            <!-- 预测风险时间轴 -->
            <section class="card panel">
              <div class="panel__head">
                <h2 class="panel__title">预测风险时间轴</h2>
                <span class="panel__hint">hover 查看时段与原因</span>
              </div>
              <div v-if="riskSegments.length" class="risk-bar mb-2">
                <div v-for="(seg, i) in riskSegments" :key="i"
                  class="risk-bar__seg" :title="seg.tip"
                  :style="{ width: seg.widthPct + '%', background: seg.color }"></div>
              </div>
              <div class="risk-legend mb-2">
                <span v-for="r in riskLegend" :key="r.label">
                  <span class="risk-legend__dot" :style="{ background: r.color }"></span>{{ r.label }}
                </span>
              </div>
              <div class="risk-ticks mb-2">
                <span v-for="(t, i) in riskTicks" :key="i">{{ t }}</span>
              </div>
              <p class="panel__hint">⚠️ 风险分级为临时规则（置信区间带宽占比 ≥15% 橙 / ≥10% 黄），待 A 提供 classifyRisk 正式计算后替换。</p>
            </section>

            <!-- 影响因子 + 模型验证（双栏） -->
            <div class="panel--row2">
              <section class="card panel">
                <div class="panel__head">
                  <h2 class="panel__title">影响因子贡献</h2>
                  <span class="panel__hint">影响因子贡献</span>
                </div>
                <div ref="factorChart" class="w-full h-64"></div>
              </section>
              <section class="card panel">
                <div class="panel__head">
                  <h2 class="panel__title">模型验证</h2>
                  <span class="panel__hint">30 天序列待 A 补充</span>
                </div>
                <table class="v-table">
                  <thead>
                    <tr><th>指标</th><th class="num">数值</th><th>说明</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="m in modelCards" :key="m.label">
                      <td>{{ m.label }}</td>
                      <td class="num">{{ m.value }}</td>
                      <td class="text-xs text-gray-400">{{ m.tag }}</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>

            <!-- 经营影响分析 -->
            <section class="card panel">
              <div class="panel__head">
                <h2 class="panel__title">经营影响分析</h2>
                <span class="panel__hint" v-if="isLevel1">AI 建议</span>
              </div>
              <div ref="aiCard" class="mb-4"></div>
              <h3 class="text-base font-semibold mb-2">日前电价参考（未来 {{ scale }}）</h3>
              <div ref="priceChart" class="w-full h-48 mb-4"></div>
              <div class="action-row">
                <a href="/pages/p3.html" class="btn btn--accent">重新计算储能方案</a>
                <a href="/pages/p4.html" class="btn btn--ghost">重新计算交易方案</a>
              </div>
            </section>
          </template>

          <div ref="prov"></div>
        </main>
      `,
      computed: {
        riskLegend() {
          return [
            { label: RISK_RULES.low.label, color: RISK_RULES.low.color },
            { label: RISK_RULES.mid.label, color: RISK_RULES.mid.color },
            { label: RISK_RULES.high.label, color: RISK_RULES.high.color },
          ];
        },
        // ===== 风险时间轴小时刻度（首尾 + 3 等分点）=====
        riskTicks() {
          const v = this.view;
          if (!v || !v.labels || !v.labels.length) return [];
          const n = v.labels.length;
          const idx = [0, Math.floor((n - 1) * 0.25), Math.floor((n - 1) * 0.5), Math.floor((n - 1) * 0.75), n - 1];
          return idx.map((i) => v.labels[i]);
        },
        // ===== 顶部元信息 =====
        metaLine() {
          if (!this.gen) return "";
          return "数据更新 " + this.gen.meta.updated + " · " + this.gen.meta.level;
        },
        isLevel1() {
          return this.gen && String(this.gen.meta.level || "").indexOf("Level 1") === 0;
        },
        // ===== 固定数据区（艺术字）=====
        todayKpis() {
          if (!this.gen) return [];
          const t = this.gen.today;
          return [
            { label: "未来24h预计发电", value: formatNumber(t.total, 1), unit: "MWh",
              wind: formatNumber(t.wind, 1), pv: formatNumber(t.pv, 1), color: "#15803C" },
            { label: "预测置信度", value: formatPercent(t.confidence), unit: "", color: "#15803C" },
            { label: "预计最大偏差", value: "±" + formatNumber(t.max_dev_pct, 1), unit: "%", color: "#B91C1C" },
            { label: "可交易电量", value: formatNumber(t.tradable, 1), unit: "MWh", color: "#15803C" },
            { label: "可调储能", value: formatNumber(t.storage_available_mwh, 1), unit: "MWh", color: "#15803C" },
          ];
        },
        // ===== 主预测图视图（按时间尺度截取）=====
        can7D() {
          return this.gen && this.gen.forecast.length >= SCALE_HOURS['7D'];
        },
        view() {
          if (!this.gen) return null;
          const f = this.gen.forecast || [];
          const a = this.gen.actual || [];
          const n = Math.min(SCALE_HOURS[this.scale] || 24, f.length);
          return {
            hours: n,
            labels: f.slice(0, n).map((x) => x.time.slice(11, 16)),
            actual: a.slice(0, n).map((x) => x.gen_total),
            forecast: f.slice(0, n).map((x) => x.gen_total),
            upper: f.slice(0, n).map((x) => x.upper),
            lower: f.slice(0, n).map((x) => x.lower),
            price: f.slice(0, n).map((x) => ({ label: x.time.slice(11, 16), value: x.price_day_ahead })),
          };
        },
        // ===== 风险时间轴（临时规则，合并连续同等级时段）=====
        riskSegments() {
          const v = this.view;
          if (!v) return [];
          const f = this.gen.forecast || [];
          const hours = v.hours;
          const levels = [];
          for (let i = 0; i < hours; i++) {
            const row = f[i];
            if (!row) { levels.push({ level: 'low' }); continue; }
            let level = 'low';
            const bw = row.gen_total > 0.5 ? ((row.upper - row.lower) / row.gen_total) * 100 : 0;
            if (bw >= RISK_RULES.high.bandwidthPct) level = 'high';
            else if (bw >= RISK_RULES.mid.bandwidthPct) level = 'mid';
            levels.push({ level, time: row.time });
          }
          // 合并连续同等级 → 时段
          const segs = [];
          levels.forEach((x, i) => {
            const last = segs[segs.length - 1];
            if (last && last.level === x.level) { last.endIdx = i; last.end = x.time; }
            else segs.push({ level: x.level, start: x.time, end: x.time, startIdx: i, endIdx: i });
          });
          return segs.map((s) => ({
            ...s,
            widthPct: ((s.endIdx - s.startIdx + 1) / hours) * 100,
            color: RISK_RULES[s.level].color,
            label: RISK_RULES[s.level].label,
            tip: `${s.start.slice(11, 16)}–${s.end.slice(11, 16)} ${RISK_RULES[s.level].label}`
              + (s.level === 'low' ? '，预测表现平稳' : '（临时规则，待 A 提供正式计算）'),
          }));
        },
        // ===== 影响因子 + 模型验证 =====
        factorTotal() {
          return this.factors.reduce((s, x) => s + x.value, 0);
        },
        modelCards() {
          if (!this.gen) return [];
          const m = this.gen.model;
          return [
            { label: "风电预测 MAPE", value: formatPercent(m.wind.mape_pct), tag: m.wind.name + " " + m.wind.version },
            { label: "光伏预测 MAPE", value: formatPercent(m.pv.mape_pct), tag: m.pv.name + " " + m.pv.version },
            { label: "昨日预测", value: "127.3 MWh", tag: "—" },
            { label: "昨日实际", value: "124.8 MWh", tag: "误差 1.96%" },
          ];
        },
        // ===== 经营影响分析（pages/p2.md 5.2 链路规则）=====
        impactConclusion() {
          if (!this.gen) return "";
          const t = this.gen.today;
          // 昨日对照字段缺失 → 降级文案
          if (!this.gen.yesterday) {
            return "当前缺少昨日对照数据，暂无法判断经营指标环比变化。建议以当前预测区间、可交易电量与电价趋势进行保守决策。";
          }
          const y = this.gen.yesterday;
          if (t.tradable < y.tradable * 0.9) {
            return "预计未来 24 小时可交易电量下降，现货偏差风险增加。建议降低现货交易比例，并优先保留储能调节能力，以降低偏差考核风险。";
          }
          if (t.tradable > y.tradable * 1.1) {
            return "预计未来 24 小时可交易电量增加，交易空间扩大。建议结合日前电价走势，评估适度提升现货或中长期交易比例。";
          }
          return "预计未来 24 小时发电与可交易电量整体平稳，偏差风险可控。建议维持当前储能及交易策略，并持续关注高风险时段。";
        },
        impactChain() {
          if (!this.gen || this.gen.yesterday) return [];
          return [
            "发电变化 → 可交易电量 → 现货偏差风险（缺少昨日对照，环比暂不判定）",
            "可交易电量 128.7 MWh · 可调储能 18.2 MWh · 置信度 91%",
          ];
        },
        aiCardData() {
          if (!this.gen) return null;
          const m = this.gen.model;
          return {
            conclusion: this.impactConclusion,
            impact: this.impactChain[0] || "",
            confidence: Math.round((this.gen.today.confidence || 0.87) * 100),
            reasons: this.impactChain,
            model: { name: m.wind.name, version: m.wind.version },
            dataSources: [
              { source: this.gen.meta.source, time: this.gen.meta.updated },
              { source: "气象更新 (Open-Meteo/ERA5)", time: this.gen.meta.updated },
            ],
riskNote: "基于 WindForecast 1.4 模型 · 置信度 91%",
            actions: [
              { label: "查看依据", value: "view-evidence" },
              { label: "加入任务", value: "add-task" },
              { label: "重新模拟", value: "re-simulate" },
            ],
          };
        },
      },
      methods: {
        // ===== 数据加载 =====
        async loadData() {
          this.loading = true;
          this.error = "";
          try {
            const [gen, weather, market] = await Promise.all([
              Data("demo/generation"),
              Data("demo/weather"),
              Data("demo/market"),
            ]);
            this.gen = gen;
            this.weather = weather;
            this.market = market;
            this.loading = false;
            this.$nextTick(() => this.renderCharts());
          } catch (e) {
            this.error = e.message || "数据加载失败";
            this.loading = false;
          }
        },
        // ===== 图表渲染（容器须已渲染，勿在 v-if 内创建）=====
        renderCharts() {
          const v = this.view;
          if (!v) return;
          const fc = this.$refs.forecastChart;
          if (fc) {
            if (!this.forecastChart) this.forecastChart = createChart(fc);
            this.forecastChart.setData({
              labels: v.labels,
              actual: v.actual,
              forecast: v.forecast,
              upper: v.upper,
              lower: v.lower,
            }, { type: "confidence" });
          }
          const pc = this.$refs.priceChart;
          if (pc) {
            if (!this.priceChart) this.priceChart = createChart(pc);
            this.priceChart.setData(v.price, { type: "line", smooth: true, name: "日前电价(元/MWh)" });
          }
          const ff = this.$refs.factorChart;
          if (ff && !this.factorChart) {
            this.factorChart = createChart(ff);
            this.factorChart.setData(this.factors, { type: "pie", donut: true, legend: false });
          }
          const ac = this.$refs.aiCard;
          if (ac) {
            if (!this.card) this.card = createAICard(ac);
            if (this.aiCardData) {
              this.card.setData(this.aiCardData, { onAction: (a) => this.onCardAction(a) });
            }
          }
        },
        // 时间尺度切换：仅重刷主预测图 + 电价参考图（联动）
        refreshCharts() {
          const v = this.view;
          if (!v) return;
          if (this.forecastChart) {
            this.forecastChart.setData({
              labels: v.labels, actual: v.actual, forecast: v.forecast, upper: v.upper, lower: v.lower,
            }, { type: "confidence" });
          }
          if (this.priceChart) {
            this.priceChart.setData(v.price, { type: "line", smooth: true, name: "日前电价(元/MWh)" });
          }
        },
        setScale(s) {
          if (s === "7D" && !this.can7D) return; // 数据不足禁止切换
          this.scale = s;
        },
        onCardAction(a) {
          if (a.value === "view-evidence") this.showSource();
          else if (a.value === "add-task") location.href = "/pages/p5.html";
          // re-simulate：演示模式占位，暂不实现
        },
        // ===== 溯源弹层（B 的 provenance.js）=====
        showSource() {
          if (!this.gen || !this.prov) return;
          this.prov.open({
            name: "明日发电预测（142.3 MWh）",
            sources: [this.gen.meta.source],
            updateTime: this.gen.meta.updated,
            quality: "空值率 0%，字段类型校验通过（data/CONTRACT.md）",
            raw: "data/demo/generation.json（forecast 96h / actual 96h）",
            process: "本地物理模型，真实气象驱动",
            model: { name: this.gen.model.wind.name, version: this.gen.model.wind.version },
          });
        },
      },
      mounted() {
        this.prov = createProvenance(this.$refs.prov);
        this.loadData();
      },
      watch: {
        scale() {
          this.$nextTick(() => this.refreshCharts());
        },
      },
      beforeUnmount() {
        if (this.forecastChart) { this.forecastChart.dispose(); this.forecastChart = null; }
        if (this.priceChart) { this.priceChart.dispose(); this.priceChart = null; }
        if (this.factorChart) { this.factorChart.dispose(); this.factorChart = null; }
        if (this.card) { this.card.dispose(); this.card = null; }
        if (this.prov) { this.prov.dispose(); this.prov = null; }
      },
    });

    app.mount('#app');
  </script>
</body>
</html>
